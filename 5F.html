<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>向日葵醫院-模擬人生</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b131e;
      font-family: 'Noto Sans TC', sans-serif;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #game-canvas:active {
      cursor: grabbing;
    }
    .gta-font {
      font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
      letter-spacing: 0.04em;
    }
    .gta-shadow {
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
    }
    .hud-glass {
      background: rgba(12, 20, 31, 0.84);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    #minimap-shell {
      box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.95), 0 0 0 6px rgba(45, 212, 191, 0.45), 0 12px 28px rgba(0, 0, 0, 0.65);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0) scale(0.9); opacity: 1; }
      100% { transform: translate(-50%, -46px) scale(1.12); opacity: 0; }
    }
    .dmg-float {
      position: absolute;
      pointer-events: none;
      font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      animation: floatUpFade 0.85s ease-out forwards;
    }
  </style>
</head>
<body>
  <!-- 主 3D 渲染畫布 -->
  <canvas id="game-canvas"></canvas>

  <!-- 載入遮罩 -->
  <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-white transition-opacity duration-500">
    <div class="w-16 h-16 border-4 border-teal-400 border-t-amber-400 rounded-full animate-spin mb-4"></div>
    <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-teal-300 mb-1">向日葵醫院-模擬人生</h1>
    <p class="text-xs sm:text-sm text-slate-300">正在載入...</p>
  </div>

<!-- 左下角（小地圖正上方）：5F 員工識別證與即時聊天室面板（已同步 3F.html 大小） -->
<div class="fixed bottom-44 sm:bottom-52 left-4 z-20 w-64 sm:w-72 hud-glass rounded-xl p-2.5 text-white shadow-xl pointer-events-auto border border-teal-400/35">
  <!-- 頂部連線狀態列 -->
  <div class="flex items-center justify-between border-b border-white/10 pb-1.5 mb-1.5">
    <span id="mp-status-dot" class="text-[11px] font-bold text-teal-300">
      ● 5F 醫療樓層連線中...
    </span>
    <span id="mp-peer-count" class="px-1.5 py-0.5 rounded bg-teal-500/20 text-[10px] font-bold text-teal-300">
      1 人在線
    </span>
  </div>

  <!-- 員工識別證資訊（對應 3F 線上玩家名單區域高度） -->
  <div id="mp-badge-card" class="text-[10px] text-slate-300 max-h-14 overflow-y-auto mb-1.5">
    🪪 職員登入中
  </div>

  <!-- 5F 室內即時聊天訊息區（同步 3F 的 h-16 與 text-[11px]） -->
  <div id="mp-chat-log" class="h-16 overflow-y-auto bg-black/40 rounded p-1.5 text-[11px] space-y-1 mb-1.5 select-text">
    <div class="text-slate-400">系統：已連線至 5F 病房區頻道</div>
  </div>

  <!-- 輸入框與送出按鈕（同步 3F 的精簡輸入列與按鈕樣式） -->
  <div class="flex gap-1">
    <input id="mp-chat-input" type="text" maxlength="80" placeholder="按 Enter 發送訊息..."
      class="flex-1 bg-slate-900/90 border border-white/15 rounded px-2 py-1 text-[11px] text-white focus:border-teal-400 focus:outline-none" />
    <button id="mp-chat-send" class="px-2 py-1 rounded bg-teal-600 hover:bg-teal-500 text-[11px] font-bold cursor-pointer">
      送出
    </button>
  </div>
</div>

  <!-- 頂部橫向：全院各科區域與電梯快速傳送列 -->
  <div class="fixed top-2.5 left-1/2 -translate-x-1/2 z-20 w-[96vw] max-w-6xl">
  </div>

  <!-- 左上角：操作說明、地板材質切換與滑鼠靈敏度控制面板 -->
  <div class="fixed top-14 left-3 sm:left-4 z-20 flex flex-col gap-2 max-w-[305px] sm:max-w-[335px]">
  </div>

  <!-- 右上角：GTA 狀態欄 (時間、通緝警星、生命/護甲條、目前所在區域) -->
  <div class="fixed top-3 right-3 sm:right-4 z-20 flex flex-col items-end pointer-events-none">
    <div id="hud-clock" class="gta-font gta-shadow text-xl sm:text-2xl font-bold text-white leading-none">
      10:25
    </div>
    <div id="hud-combo-badge" class="gta-font gta-shadow text-sm sm:text-base font-bold text-emerald-400 leading-tight mt-0.5">
      健保卡已連線・5F 住院病房層
    </div>

    <!-- 生命值 & 護甲狀態條 -->
    <div class="mt-1.5 w-36 sm:w-44 space-y-1">
      <div class="w-full h-2.5 bg-black/80 rounded-sm p-0.5 border border-black">
        <div id="hud-hp-bar" class="h-full bg-gradient-to-r from-red-600 to-rose-400 transition-all duration-150" style="width: 100%;"></div>
      </div>
      <div class="w-full h-2.5 bg-black/80 rounded-sm p-0.5 border border-black">
        <div id="hud-armor-bar" class="h-full bg-gradient-to-r from-sky-600 to-cyan-300 transition-all duration-150" style="width: 100%;"></div>
      </div>
    </div>

    <!-- 通緝警星（已移除高頻閃爍動畫，改為穩定常亮） -->
    <div id="hud-wanted-stars" class="mt-1 flex items-center gap-1 text-base sm:text-lg gta-shadow">
      <span class="text-slate-600">★</span>
      <span class="text-slate-600">★</span>
      <span class="text-slate-600">★</span>
      <span class="text-slate-600">★</span>
      <span class="text-slate-600">★</span>
    </div>

    <!-- 目前所在空間徽章 -->
    <div class="mt-1.5 px-3 py-1 rounded-xl hud-glass border-l-4 border-pink-500 text-right shadow-lg">
      <div class="text-[10px] text-slate-400 font-medium">現在位置 You Are Here</div>
      <div id="current-zone-label" class="text-xs sm:text-sm font-black text-white">5F 東側護理站 B・520 病房區</div>
    </div>
  </div>

  <!-- 浮動傷害數字覆蓋層 -->
  <div id="floating-ui-layer" class="fixed inset-0 z-10 pointer-events-none overflow-hidden"></div>

  <!-- 畫面中央準心 -->
  <div id="crosshair" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-15 pointer-events-none opacity-45">
    <div class="w-5 h-5 rounded-full border border-white/80 flex items-center justify-center">
      <div class="w-1.5 h-1.5 rounded-full bg-teal-300"></div>
    </div>
  </div>

  <!-- 玩家受擊紅色邊緣濾鏡 -->
  <div id="damage-vignette" class="fixed inset-0 z-15 pointer-events-none opacity-0 transition-opacity duration-150"
       style="background: radial-gradient(circle, transparent 52%, rgba(220, 38, 38, 0.72) 100%);"></div>

  <!-- 中央下方：靠近 NPC 互動或電梯提示 -->
  <div id="talk-prompt" class="hidden fixed bottom-28 sm:bottom-12 left-1/2 -translate-x-1/2 z-20 px-5 py-2.5 rounded-full hud-glass border border-amber-400/60 text-white font-bold text-xs sm:text-sm shadow-2xl cursor-pointer">
    按 <span class="px-2 py-0.5 mx-1 rounded bg-amber-400 text-slate-950 font-black">E</span> 與 <span id="talk-target-name" class="text-teal-300">護理師</span> 對話
  </div>

  <!-- 對話與電梯樓層自動連結選擇視窗 -->
  <div id="dialogue-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/65 p-4">
    <div class="hud-glass rounded-2xl max-w-xl w-full p-5 text-white border border-teal-400/40 shadow-2xl">
      <div class="flex items-center justify-between border-b border-white/15 pb-3">
        <div class="flex items-center gap-3">
          <div id="dlg-avatar" class="w-11 h-11 rounded-full bg-teal-500/20 border border-teal-400/50 flex items-center justify-center text-xl">
            🛗
          </div>
          <div>
            <h3 id="dlg-name" class="font-black text-base sm:text-lg text-teal-300">向日葵醫院-模擬人生</h3>
            <p id="dlg-role" class="text-xs text-slate-300">請選擇要前往的樓層</p>
          </div>
        </div>
        <button id="dlg-close" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-rose-500/80 text-xs font-bold transition">
          關閉 (ESC)
        </button>
      </div>
      <p id="dlg-text" class="mt-3.5 text-sm leading-relaxed text-slate-100 bg-slate-900/65 p-3 rounded-xl border border-white/10">
        請問您要搭乘前往哪一個樓層？
      </p>
      <div id="dlg-options" class="mt-3 flex flex-col gap-2"></div>
    </div>
  </div>

  <!-- 右側通知氣泡 -->
  <div id="toast-banner" class="hidden fixed top-44 right-4 z-30 px-4 py-2 rounded-xl hud-glass border-l-4 border-teal-400 text-white text-xs sm:text-sm font-medium shadow-xl">
  </div>

  <!-- 左下角：1F ~ 5F 緊急疏散平面圖同色系圓形雷達小地圖 -->
  <div id="minimap-shell" class="fixed bottom-4 left-4 z-20 w-36 h-36 sm:w-44 sm:h-44 rounded-full overflow-hidden bg-amber-50">
    <canvas id="minimap-canvas" width="220" height="220" class="w-full h-full block"></canvas>
    <div class="absolute top-1 left-1/2 -translate-x-1/2 px-1.5 rounded bg-slate-900/85 text-[10px] font-black text-teal-300 pointer-events-none">
      N
    </div>
    <div id="minimap-floor-label" class="absolute bottom-1 left-1/2 -translate-x-1/2 px-2 py-0.2 rounded-full bg-slate-900/85 text-[9px] font-bold text-white pointer-events-none">
      5F 平面圖雷達
    </div>
  </div>

  <!-- 右下角：桌面與行動裝置皆可點擊的近戰攻擊按鈕組 -->
  <div class="fixed bottom-4 right-4 z-20 flex flex-col items-end gap-2">
    <div class="flex gap-2">
      <button id="btn-attack-light" class="px-3.5 py-2.5 rounded-full hud-glass border border-rose-400/60 text-rose-200 hover:bg-rose-500/30 font-black text-xs sm:text-sm shadow-lg active:scale-95 transition">
        👊 連擊 (J / 單擊)
      </button>
      <button id="btn-attack-heavy" class="px-3.5 py-2.5 rounded-full hud-glass border border-amber-400/60 text-amber-200 hover:bg-amber-500/30 font-black text-xs sm:text-sm shadow-lg active:scale-95 transition">
        💥 重擊 (K)
      </button>
    </div>
    <!-- 行動裝置虛擬方向鍵 -->
    <div class="md:hidden grid grid-cols-3 gap-1 w-32 h-32">
      <div></div>
      <button data-key="KeyW" class="touch-dir rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">▲</button>
      <div></div>
      <button data-key="KeyA" class="touch-dir rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">◀</button>
      <button data-key="KeyS" class="touch-dir rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">▼</button>
      <button data-key="KeyD" class="touch-dir rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">▶</button>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 向日葵醫院-模擬人生
     * ============================================================================
     * 1. 【變更全院地板材質】：
     *    - 全館預設地坪升級為「高級亮面微晶石／水磨石醫療防滑磁磚地板（Polished Terrazzo & Porcelain Tile）」，
     *      具備象牙白／淺灰米色基底、細膩暖灰與淡藍綠天然骨材碎石顆粒、60x60cm 柔和分格線與法線凹凸質感。
     *    - 走廊壓條同步更新為深灰岩板金屬收邊條，並支援左上角一鍵切換「水磨石醫療磚 / 大理石紋地磚 / 溫潤木紋地板」。
     * 2. 【徹底消除任何閃頻 (Zero Flicker / Zero Z-Fighting / Anti-Moiré)】：
     *    - 關閉 logarithmicDepthBuffer，採用標準高精度深度緩衝並設定 camera near = 0.5, far = 180。
     *    - 全貼圖強制啟用 LinearMipmapLinearFilter + 最大各向異性過濾 (getMaxAnisotropy)，
     *      且磁磚分格線採柔和漸層低高頻對比設計，徹底杜絕移動時的遠景摩爾紋閃頻。
     *    - 所有同層子樓板之間保留嚴格水平微間隙（>= 0.04 單位）與垂直高度差，零共面重疊。
     *    - 電梯地面感應墊改為靜態穩定發光（固定 opacity: 0.24, y = baseY + 0.045, depthWrite: false），
     *      警星移除 animate-pulse 閃爍動畫。
     */

    // --------------------------------------------------------------------------
    // 全域狀態與核心變數
    // --------------------------------------------------------------------------
    let scene, camera, renderer;
    const clock = new THREE.Clock();

    // 牆面與大型醫療設施碰撞箱陣列：{ minX, maxX, minZ, maxZ, floor, label }
    const colliders = [];

    // 電梯自動接觸感應區清單
    const transportTriggers = [];
    const transportPadMeshes = [];
    let transportLockout = false;
    let activeTransportZone = null;

    // NPC 實體陣列與 3D 懸浮標籤
    const npcs = [];
    const npcSprites = [];
    let showNpcLabels = true;
    let firstPersonMode = false;

    // 鍵盤與輸入狀態
    const keys = {};
    let activeTalkNpc = null;

    // 玩家圓弧立體角色與戰鬥狀態
    const player = {
      mesh: null,
      headGroup: null,
      leftShoulder: null,
      rightShoulder: null,
      leftElbow: null,
      rightElbow: null,
      leftHip: null,
      rightHip: null,
      rightFistAura: null,
      leftFistAura: null,
      rightFootAura: null,
      pos: new THREE.Vector3(16.5, 13.8, -23.5),
      vel: new THREE.Vector3(0, 0, 0),
      yaw: Math.PI,
      radius: 0.42,
      onGround: true,
      walkCycle: 0,
      hp: 100,
      maxHp: 100,
      armor: 100,
      wantedStars: 0,
      isAttacking: false,
      attackType: 'light',
      attackTimer: 0,
      attackDuration: 0.34,
      comboStep: 0,
      comboResetTimer: 0,
      hitRegisteredThisSwing: false,
      hurtCooldown: 0,
      isKneeling: false
    };

    let prayerAutoDoor = { leftLeaf: null, rightLeaf: null, openAmount: 0 };
    const prayerCushionSpots = [];

    // 免鎖定滑鼠平滑相機軌道狀態
    const camState = {
      yaw: Math.PI,
      pitch: 0.22,
      distance: 4.5,
      targetYaw: Math.PI,
      targetPitch: 0.22,
      targetDistance: 4.5,
      targetPos: new THREE.Vector3(16.5, 15.25, -23.5),
      sensitivity: 1.1,
      isRightDragging: false,
      isLeftDragging: false,
      dragMovedDist: 0,
      lastClientX: null,
      lastClientY: null
    };

    const slashEffects = [];
    const hitParticles = [];

    // 讀取 index.html 登入的員工識別證資訊（支援網址參數、vh_user_session 與 localStorage）
const urlParams5F = new URLSearchParams(window.location.search);
let vhSession5F = null;
try {
  vhSession5F = JSON.parse(sessionStorage.getItem('vh_user_session') || 'null');
} catch (e) {}

const ROLE_NAME_MAP_5F = {
  nurse: '護理師',
  doctor: '醫師',
  it_engineer: '資訊工程師',
  educator: '衛教師'
};

const rawRole5F =
  urlParams5F.get('role') ||
  (vhSession5F && vhSession5F.roleId) ||
  localStorage.getItem('vh_last_role') ||
  sessionStorage.getItem('staff_role') ||
  'nurse';

const resolvedRoleName5F = ROLE_NAME_MAP_5F[rawRole5F] || rawRole5F;
const resolvedCard5F =
  urlParams5F.get('card') ||
  (vhSession5F && vhSession5F.cardNumber) ||
  localStorage.getItem('vh_last_card') ||
  sessionStorage.getItem('staff_card') ||
  '';

const resolvedName5F =
  urlParams5F.get('name') ||
  (vhSession5F && vhSession5F.staffName) ||
  localStorage.getItem('vh_last_name') ||
  sessionStorage.getItem('staff_name') ||
  '';

// 若尚未透過 index.html 刷卡登入，自動導回門禁首頁（本機預覽或已登入則放行）
if (!resolvedCard5F || !resolvedName5F) {
  window.location.href = 'index.html';
}

const staffAuth5F = {
  card: resolvedCard5F || 'SF-5001',
  name: resolvedName5F || '5F 值班同仁',
  roleId: rawRole5F,
  role: resolvedRoleName5F
};

sessionStorage.setItem('staff_card', staffAuth5F.card);
sessionStorage.setItem('staff_name', staffAuth5F.name);
sessionStorage.setItem('staff_role', staffAuth5F.role);

// 5F 專屬 PeerJS 星狀網路房間 ID（與 2F 區隔）
const ROOM_HOST_ID_5F = 'sunflower-hospital-5f-indoor-v1';
let peer5F = null;
let isHost5F = false;
let hostConn5F = null;
const clientConns5F = new Map();
const remotePlayers5F = new Map();
let myPeerId5F = '';

    // 全院 1F ~ 5F 快速傳送座標表
    const ZONES = {
      f5_ward_east:    { label: '5F 東側護理站 B・E化行動護理車 / 520 病房走廊', pos: new THREE.Vector3(16.5, 13.8, -23.5), yaw: Math.PI },
      f5_room_520:     { label: '5F 520 雙人住院病房內部（薄荷綠病床・點滴架・臥床病患）', pos: new THREE.Vector3(16.5, 13.8, -32.2), yaw: Math.PI },
      f5_elevator:     { label: '5F 中央電梯轉乘廳 (可往 B1 ~ 8F)', pos: new THREE.Vector3(0, 13.8, 8.2), yaw: Math.PI },
      f5_nursing_west: { label: '5F 西側護理站 B/C・558 病房・537 負壓隔離病房', pos: new THREE.Vector3(-22.5, 13.8, -23.5), yaw: Math.PI },
      f5_chapel:       { label: '5F 中央護理站 A・祈禱室・神明廳・點滴庫房', pos: new THREE.Vector3(0, 13.8, -12.5), yaw: 0 },
      f5_rotunda:      { label: '5F 南側・半圓弧玻璃展望大廳', pos: new THREE.Vector3(0, 13.8, 34.5), yaw: 0 },
      f3_rotunda:      { label: '3F 南側・中央圓弧玻璃展望廳', pos: new THREE.Vector3(0, 9.2, 36.5), yaw: Math.PI },
      f3_sleep:        { label: '3F 西北側・睡眠中心 & 婦產科 VIP 病房 / 嬰兒室', pos: new THREE.Vector3(-22.5, 9.2, -16.5), yaw: Math.PI },

    // --------------------------------------------------------------------------
    // 1. Web Audio API 合成打擊與電梯提示音效系統
    // --------------------------------------------------------------------------
    const SoundFX = (() => {
      let ctx = null;
      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function playElevatorChime() {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime;
        [587.33, 880].forEach((freq, idx) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.14, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.35);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.36);
        });
      }

      function playSwing(isHeavy = false) {
        const c = ensureCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isHeavy ? 210 : 280, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(55, c.currentTime + 0.14);
        gain.gain.setValueAtTime(0.18, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.16);
      }

      function playImpact(isHeavy = false) {
        const c = ensureCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = isHeavy ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(isHeavy ? 140 : 185, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(36, c.currentTime + 0.18);
        gain.gain.setValueAtTime(isHeavy ? 0.28 : 0.2, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.19);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.2);
      }

      function playPlayerHurt() {
        const c = ensureCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, c.currentTime);
        osc.frequency.linearRampToValueAtTime(75, c.currentTime + 0.22);
        gain.gain.setValueAtTime(0.24, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.23);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.24);
      }

      return { playElevatorChime, playSwing, playImpact, playPlayerHurt };
    })();

    // --------------------------------------------------------------------------
    // 2. 平滑全圓弧幾何體工廠 (Three.js r128 無接縫膠囊建構器)
    // --------------------------------------------------------------------------
    function createSmoothCapsuleGeometry(radius, length, capSegments = 12, radialSegments = 20) {
      const halfLen = Math.max(0.001, length * 0.5);
      const points = [];
      for (let i = 0; i <= capSegments; i++) {
        const theta = (i / capSegments) * (Math.PI * 0.5);
        points.push(new THREE.Vector2(Math.sin(theta) * radius, -halfLen - Math.cos(theta) * radius));
      }
      for (let i = 0; i <= capSegments; i++) {
        const theta = (i / capSegments) * (Math.PI * 0.5);
        points.push(new THREE.Vector2(Math.cos(theta) * radius, halfLen + Math.sin(theta) * radius));
      }
      const geom = new THREE.LatheGeometry(points, radialSegments);
      geom.computeVertexNormals();
      return geom;
    }

    // --------------------------------------------------------------------------
    // 3. 實景級無閃頻程序化貼圖工廠
    //    （高級亮面水磨石醫療防滑磁磚、大理石紋微晶石、溫潤木紋、抗摩爾紋天花板）
    // --------------------------------------------------------------------------
    const ArchitecturalMaterials = (() => {
      const cache = {};

      function applyAntiAliasingFilter(tex, repeatX, repeatY) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeatX, repeatY);
        tex.generateMipmaps = true;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        if (renderer && renderer.capabilities) {
          tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
        } else {
          tex.anisotropy = 8;
        }
        tex.needsUpdate = true;
      }

      /**
       * 1) 全新預設：高級亮面微晶石／水磨石醫療防滑磁磚地板 (Polished Terrazzo Medical Tile)
       *    - 象牙白與淺灰米色溫潤基底，搭配細膩天然暖灰與淡藍綠礦物骨材顆粒
       *    - 柔和漸層 60x60cm 磁磚分格線，避免遠景高頻摩爾紋閃頻
       */
      function getTerrazzoTileFloorMaterial(repeatX = 34, repeatY = 30, elevated = false) {
        const key = `floor_terrazzo_${repeatX}_${repeatY}_${elevated ? 1 : 0}`;
        if (cache[key]) return cache[key];

        const size = 1024;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        const bumpCanvas = document.createElement('canvas');
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        const bctx = bumpCanvas.getContext('2d');
        bctx.fillStyle = '#efefef';
        bctx.fillRect(0, 0, size, size);

        // 4x4 塊 60x60cm 水磨石磁磚單元
        const tiles = 4;
        const tileSize = size / tiles;
        const baseTones = ['#f3efe8', '#efeae1', '#f5f2ec', '#ede8df'];

        // 決定性偽隨機數產生器，保證多區塊之間紋理自然一致
        let seed = 13579;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };

        for (let r = 0; r < tiles; r++) {
          for (let c = 0; c < tiles; c++) {
            const tx = c * tileSize;
            const ty = r * tileSize;
            ctx.fillStyle = baseTones[(r * 3 + c * 5) % baseTones.length];
            ctx.fillRect(tx, ty, tileSize, tileSize);

            // 細微云霧色階變化
            const grad = ctx.createRadialGradient(
              tx + tileSize * (0.35 + rand() * 0.3),
              ty + tileSize * (0.35 + rand() * 0.3),
              10,
              tx + tileSize * 0.5,
              ty + tileSize * 0.5,
              tileSize * 0.72
            );
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.24)');
            grad.addColorStop(1, 'rgba(203, 213, 225, 0.14)');
            ctx.fillStyle = grad;
            ctx.fillRect(tx, ty, tileSize, tileSize);
          }
        }

        // 天然水磨石碎石骨材顆粒（暖灰、米褐、淡藍綠礦物石粒）
        const chipColors = [
          'rgba(148, 163, 184, 0.42)', // 暖岩灰
          'rgba(180, 168, 152, 0.45)', // 砂岩米褐
          'rgba(110, 168, 162, 0.32)', // 淡醫療青綠石粒
          'rgba(255, 255, 255, 0.72)', // 白石英結晶
          'rgba(100, 116, 139, 0.30)'  // 深頁岩微粒
        ];

        for (let i = 0; i < 2400; i++) {
          const px = rand() * size;
          const py = rand() * size;
          const rad = 1.1 + rand() * 3.4;
          ctx.fillStyle = chipColors[Math.floor(rand() * chipColors.length)];
          ctx.beginPath();
          const sides = 4 + Math.floor(rand() * 3);
          for (let s = 0; s < sides; s++) {
            const ang = (s / sides) * Math.PI * 2 + rand() * 0.5;
            const rJitter = rad * (0.65 + rand() * 0.55);
            const vx = px + Math.cos(ang) * rJitter;
            const vy = py + Math.sin(ang) * rJitter;
            if (s === 0) ctx.moveTo(vx, vy);
            else ctx.lineTo(vx, vy);
          }
          ctx.closePath();
          ctx.fill();
        }

        // 柔和抗摩爾紋磁磚接縫線（低高頻對比漸層填縫，遠距離不閃頻）
        for (let i = 0; i <= tiles; i++) {
          const p = i * tileSize;

          // 水平縫
          const hGrad = ctx.createLinearGradient(0, p - 4, 0, p + 4);
          hGrad.addColorStop(0, 'rgba(148, 163, 184, 0)');
          hGrad.addColorStop(0.5, 'rgba(148, 163, 184, 0.34)');
          hGrad.addColorStop(1, 'rgba(148, 163, 184, 0)');
          ctx.fillStyle = hGrad;
          ctx.fillRect(0, p - 4, size, 8);

          // 垂直縫
          const vGrad = ctx.createLinearGradient(p - 4, 0, p + 4, 0);
          vGrad.addColorStop(0, 'rgba(148, 163, 184, 0)');
          vGrad.addColorStop(0.5, 'rgba(148, 163, 184, 0.34)');
          vGrad.addColorStop(1, 'rgba(148, 163, 184, 0)');
          ctx.fillStyle = vGrad;
          ctx.fillRect(p - 4, 0, 8, size);

          bctx.strokeStyle = '#b8b8b8';
          bctx.lineWidth = 3;
          bctx.beginPath(); bctx.moveTo(0, p); bctx.lineTo(size, p); bctx.stroke();
          bctx.beginPath(); bctx.moveTo(p, 0); bctx.lineTo(p, size); bctx.stroke();
        }

        const mapTex = new THREE.CanvasTexture(canvas);
        applyAntiAliasingFilter(mapTex, repeatX, repeatY);

        const bumpTex = new THREE.CanvasTexture(bumpCanvas);
        applyAntiAliasingFilter(bumpTex, repeatX, repeatY);

        const mat = new THREE.MeshStandardMaterial({
          map: mapTex,
          bumpMap: bumpTex,
          bumpScale: 0.004,
          roughness: 0.24,
          metalness: 0.08,
          polygonOffset: elevated,
          polygonOffsetFactor: elevated ? -2 : 0,
          polygonOffsetUnits: elevated ? -2 : 0
        });
        cache[key] = mat;
        return mat;
      }

      /**
       * 2) 可選切換：高級卡拉拉白大理石紋拋光磚 (Polished Carrara Marble Tile)
       */
      function getMarbleTileFloorMaterial(repeatX = 34, repeatY = 30, elevated = false) {
        const key = `floor_marble_${repeatX}_${repeatY}_${elevated ? 1 : 0}`;
        if (cache[key]) return cache[key];

        const size = 1024;

        // 柔和天然大理石水墨流紋

          ctx.lineWidth = 1.5 + (v % 4) * 1.4;

          for (let step = 1; step <= 8; step++) {
            sy = (size / 8) * step;
            sx += Math.sin(v * 1.7 + step * 0.9) * 48;

          }

        }

        const tiles = 4;
        const tileSize = size / tiles;
        for (let i = 0; i <= tiles; i++) {
          const p = i * tileSize;
          ctx.fillStyle = 'rgba(148, 163, 184, 0.28)';
          ctx.fillRect(0, p - 1.5, size, 3);
          ctx.fillRect(p - 1.5, 0, 3, size);
        }

        const mapTex = new THREE.CanvasTexture(canvas);
        applyAntiAliasingFilter(mapTex, repeatX, repeatY);

        const mat = new THREE.MeshStandardMaterial({
          map: mapTex,

          metalness: 0.12,

          polygonOffsetFactor: elevated ? -2 : 0,
          polygonOffsetUnits: elevated ? -2 : 0

      /**

      function getWarmWoodFloorMaterial(repeatX = 34, repeatY = 30, elevated = false) {
        const key = `floor_wood_${repeatX}_${repeatY}_${elevated ? 1 : 0}`;
        if (cache[key]) return cache[key];

        const size = 1024;

        for (let row = 0; row < size / plankH; row++) {

            const toneIdx = Math.abs(row * 7 + col * 5) % woodShades.length;

          ctx.fillRect(0, h * 0.94, w, h * 0.06);
        } else if (style === 'clinical_pink') {
          ctx.fillStyle = '#fdf8f6';
          ctx.fillRect(0, 0, w, h * 0.58);
          ctx.fillStyle = '#f9dce8';
          ctx.fillRect(0, h * 0.58, w, h * 0.36);
          ctx.fillStyle = '#db2777';
          ctx.fillRect(0, h * 0.57, w, 8);
          ctx.fillStyle = '#475569';
          ctx.fillRect(0, h * 0.94, w, h * 0.06);
        } else {
          ctx.fillStyle = '#efe8da';
          ctx.fillRect(0, 0, w, h);
          ctx.strokeStyle = 'rgba(168, 154, 132, 0.32)';
          ctx.lineWidth = 2;
          for (let y = 0; y <= h; y += 64) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
          }
          for (let x = 0; x <= w; x += 128) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          }
          ctx.fillStyle = '#334155';
          ctx.fillRect(0, h * 0.94, w, h * 0.06);
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.repeat.set(repeatX, 1);
        tex.generateMipmaps = true;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.anisotropy = 8;

        const mat = new THREE.MeshStandardMaterial({
          map: tex,
          roughness: 0.55,
          metalness: 0.05
        });
        cache[key] = mat;
        return mat;
      }

      function getFrostedBandGlassMaterial() {
        if (cache['frosted_glass']) return cache['frosted_glass'];

        const w = 256;
        const h = 512;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(186, 230, 253, 0.32)';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(241, 245, 249, 0.78)';
        ctx.fillRect(0, h * 0.34, w, h * 0.32);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.fillRect(0, h * 0.32, w, 6);
        ctx.fillRect(0, h * 0.67, w, 6);

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, w, h);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.repeat.set(3, 1);

        const mat = new THREE.MeshStandardMaterial({
          map: tex,
          transparent: true,
          opacity: 0.88,
          roughness: 0.22,
          metalness: 0.35,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        cache['frosted_glass'] = mat;
        return mat;
      }

      return {
        getFloorMaterialByStyle,
        getAcousticCeilingMaterial,
        getWallMaterial,
        getFrostedBandGlassMaterial
      };
    })();

    function createSignTexture(title, subtitle = '', bgColor = '#0f4c5c', accentColor = '#2dd4bf') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 220;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 1024, 220);

      ctx.fillStyle = accentColor;
      ctx.fillRect(0, 0, 1024, 14);
      ctx.fillRect(0, 206, 1024, 14);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (subtitle) {
        ctx.font = '900 62px "Noto Sans TC", sans-serif';
        ctx.fillText(title, 512, 86);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '700 28px "Chakra Petch", "Noto Sans TC", sans-serif';
        ctx.fillText(subtitle, 512, 160);
      } else {
        ctx.font = '900 68px "Noto Sans TC", sans-serif';
        ctx.fillText(title, 512, 112);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.anisotropy = 8;
      return tex;
    }

    function addHangingSign(x, y, z, w, h, title, subtitle = '', bgColor = '#0f4c5c', accentColor = '#2dd4bf', rotY = 0) {

    /**
     * 實景級牆體建構器
     */
    function addWall(cx, cz, w, d, h = 4.4, mat = null, label = '牆面', floor = 1, baseY = 0, wallStyle = null, addRail = true) {
      let material = mat;
      const span = Math.max(w, d);
      const repX = Math.max(1, Math.round(span / 4.2));

      if (wallStyle) {
        material = ArchitecturalMaterials.getWallMaterial(wallStyle, repX);
      } else if (!material) {
        material = ArchitecturalMaterials.getWallMaterial('ward', repX);
      }

      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(cx, baseY + h / 2, cz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      if (h >= 4.0 && floor > 0 && wallStyle !== 'glass') {
        const trimMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.45, metalness: 0.35 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0xc2988e, roughness: 0.42 });
        const railSteelMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.22, metalness: 0.85 });

        const baseTrim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.14, d + 0.04), trimMat);
        baseTrim.position.set(cx, baseY + 0.07, cz);
        scene.add(baseTrim);

        if (addRail && span >= 3.2) {
          const railMesh = new THREE.Mesh(new THREE.BoxGeometry(w + 0.11, 0.09, d + 0.11), railMat);
          railMesh.position.set(cx, baseY + 0.92, cz);
          const steelStrip = new THREE.Mesh(new THREE.BoxGeometry(w + 0.125, 0.026, d + 0.125), railSteelMat);
          steelStrip.position.set(cx, baseY + 0.92, cz);
          scene.add(railMesh, steelStrip);
        }
      }

      colliders.push({
        minX: cx - w / 2,
        maxX: cx + w / 2,
        minZ: cz - d / 2,
        maxZ: cz + d / 2,
        floor,
        label
      });
      return mesh;
    }

      const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.10, 2.26, 0.22), frameMat);

        leafPivot.rotation.y = dirSign * -1.42;
      }

      const plaqueTex = createSignTexture(

    // --------------------------------------------------------------------------
    function buildInpatientHospitalBed(x, z, baseY, rotY = 0, opts = {}) {
      const g = new THREE.Group();
      const woodBoardMat = new THREE.MeshStandardMaterial({ color: 0xc29363, roughness: 0.48 });
      const frameCreamMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.35, metalness: 0.25 });
      const mintMattressMat = new THREE.MeshStandardMaterial({ color: 0x86c8b5, roughness: 0.68 });
      const mintBlanketMat = new THREE.MeshStandardMaterial({ color: 0x76b9a5, roughness: 0.72 });
      const mintPillowMat = new THREE.MeshStandardMaterial({ color: 0x9bd6c5, roughness: 0.65 });
      const steelMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.88, roughness: 0.18 });
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });

      const underFrame = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.16, 1.88), frameCreamMat);
      underFrame.position.set(0, 0.30, 0);
      underFrame.castShadow = true;
      g.add(underFrame);

      [[-0.40, -0.88], [0.40, -0.88], [-0.40, 0.88], [0.40, 0.88]].forEach(([wx, wz]) => {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.05, 14), wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(wx, 0.065, wz);
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.22, 10), frameCreamMat);
        leg.position.set(wx, 0.18, wz);
        g.add(wheel, leg);
      });

      [-0.98, 0.98].forEach((bz, idx) => {
        const hBoard = idx === 0 ? 0.66 : 0.56;
        const boardOuter = new THREE.Mesh(new THREE.BoxGeometry(1.02, hBoard, 0.06), frameCreamMat);
        boardOuter.position.set(0, 0.34 + hBoard * 0.5, bz);
        boardOuter.castShadow = true;

        const boardWood = new THREE.Mesh(new THREE.BoxGeometry(0.86, hBoard - 0.12, 0.072), woodBoardMat);
        boardWood.position.set(0, 0.34 + hBoard * 0.5, bz);
        g.add(boardOuter, boardWood);
      });

      const mattress = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.17, 1.90), mintMattressMat);
      mattress.position.set(0, 0.46, 0);
      mattress.castShadow = true;
      mattress.receiveShadow = true;
      g.add(mattress);

      const pillow = new THREE.Mesh(
        createSmoothCapsuleGeometry(0.11, 0.42, 10, 14),
        mintPillowMat
      );
      pillow.rotation.z = Math.PI / 2;
      pillow.scale.set(0.65, 1.0, 1.35);
      pillow.position.set(0, 0.59, -0.68);
      g.add(pillow);

      if (!opts.hasPatient) {
        const foldedQuilt = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.09, 0.72), mintBlanketMat);
        foldedQuilt.position.set(0, 0.58, 0.38);
        foldedQuilt.castShadow = true;
        g.add(foldedQuilt);
      } else {
        const coverQuilt = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.14, 1.08), mintBlanketMat);
        coverQuilt.position.set(0, 0.62, 0.25);
        coverQuilt.castShadow = true;
        g.add(coverQuilt);
      }

      [-0.49, 0.49].forEach((rx) => {
        const railTop = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 1.15), frameCreamMat);
        railTop.position.set(rx, 0.72, -0.12);
        const railBot = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 1.15), frameCreamMat);
        railBot.position.set(rx, 0.54, -0.12);
        [-0.55, 0, 0.35].forEach((rz) => {
          const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.20, 8), steelMat);
          bar.position.set(rx, 0.63, rz);
          g.add(bar);
        });
        g.add(railTop, railBot);
      });

      const ivSide = opts.ivSide !== undefined ? opts.ivSide : 1;
      const ivX = ivSide * 0.68;
      const ivZ = -0.58;
      const ivGroup = new THREE.Group();

      for (let spoke = 0; spoke < 5; spoke++) {
        const ang = (spoke / 5) * Math.PI * 2;
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.03, 0.28), steelMat);
        arm.position.set(Math.sin(ang) * 0.14, 0.05, Math.cos(ang) * 0.14);
        arm.rotation.y = ang;
        const caster = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), wheelMat);

        ivGroup.add(arm, caster);

      const lowerPole = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 1.15, 10), steelMat);
      lowerPole.position.set(0, 0.60, 0);
      const upperPole = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.014, 0.95, 10), steelMat);
      upperPole.position.set(0, 1.60, 0);
      const hookBar = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.016, 0.016), steelMat);
      hookBar.position.set(0, 2.06, 0);
      ivGroup.add(lowerPole, upperPole, hookBar);

      const ivBagMat = new THREE.MeshStandardMaterial({
        color: 0xe0f2fe,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.22,
        transparent: true,
        opacity: 0.82,
        roughness: 0.15

      ivBag.position.set(-0.10, 1.88, 0);
      const ivLabel = new THREE.Mesh(
        new THREE.PlaneGeometry(0.08, 0.10),
        new THREE.MeshBasicMaterial({ color: 0x0284c7 })
      );
      ivLabel.position.set(-0.10, 1.88, 0.024);

      const dripChamber = new THREE.Mesh(
        new THREE.CylinderGeometry(0.014, 0.014, 0.08, 8),
        ivBagMat
      );
      dripChamber.position.set(-0.10, 1.70, 0);
      ivGroup.add(ivBag, ivLabel, dripChamber);

      ivGroup.position.set(ivX, 0, ivZ);
      g.add(ivGroup);

      g.position.set(x, baseY, z);
      g.rotation.y = rotY;
      scene.add(g);

      const cosR = Math.abs(Math.cos(rotY));
      const sinR = Math.abs(Math.sin(rotY));
      const halfW = 0.65 * cosR + 1.05 * sinR;
      const halfD = 1.05 * cosR + 0.65 * sinR;

      colliders.push({
        minX: x - halfW,
        maxX: x + halfW,
        minZ: z - halfD,
        maxZ: z + halfD,
        floor: getFloorNumber(baseY),
        label: `${opts.roomName || '住院病房'}病床與點滴架`
      });
    }

    function createRoundedCharacterRig(opts = {}) {

      head.scale.set(0.95, 1.08, 0.98);

          createSmoothCapsuleGeometry(0.11, 0.12, 10, 16),

        const elbowPivot = new THREE.Group();

        const forearm = new THREE.Mesh(createSmoothCapsuleGeometry(0.058, 0.17, 10, 14), skinMat);
        forearm.position.y = -0.13;

      return {

        leftShoulder: leftArm.shoulderPivot,
        rightShoulder: rightArm.shoulderPivot,
        leftElbow: leftArm.elbowPivot,
        rightElbow: rightArm.elbowPivot,

    }

    function createNpcNameSprite(name, role, badgeColor = '#2dd4bf') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(10, 18, 28, 0.86)';
      ctx.beginPath();
      ctx.roundRect(24, 16, 464, 96, 28);
      ctx.fill();

      ctx.strokeStyle = badgeColor;
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 34px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(name, 256, 56);

      ctx.fillStyle = badgeColor;
      ctx.font = '700 22px "Noto Sans TC", sans-serif';
      ctx.fillText(role, 256, 92);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.35, 0.58, 1);
      sprite.position.y = 2.15;
      return sprite;
    }

      function getRoleOutfit5F(role) {

function appendChat5F(sender, role, text, isSystem = false) {
  const log = document.getElementById('mp-chat-log');
  if (!log) return;
  const row = document.createElement('div');
  if (isSystem) {
    row.className = 'text-amber-300/90';
    row.textContent = `系統：${text}`;
  } else {
    row.innerHTML = `<span class="font-bold text-teal-300">[${role}] ${sender}：</span><span class="text-slate-100"></span>`;
    row.querySelector('span:last-child').textContent = text;
  }
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function updatePeerCountUI5F() {
  const el = document.getElementById('mp-peer-count');
  if (el) el.textContent = `${remotePlayers5F.size + 1} 人在線`;
}

function upsertRemotePlayer5F(data) {
  if (!data || !data.id || data.id === myPeerId5F) return;
  let rp = remotePlayers5F.get(data.id);
  if (!rp) {
    const rig = createRoundedCharacterRig(getRoleOutfit5F(data.role || '同仁'));
    const sprite = createNpcNameSprite(data.name || '同仁', `${data.role || '職員'}`, '#38bdf8');
    rig.group.add(sprite);
    rig.group.position.set(data.x ?? 16.5, data.y ?? 13.8, data.z ?? -23.5);
    scene.add(rig.group);
    rp = {
      rig,
      mesh: rig.group,
      targetPos: new THREE.Vector3(data.x ?? 16.5, data.y ?? 13.8, data.z ?? -23.5),
      targetYaw: data.yaw ?? Math.PI,
      walkCycle: 0,
      moving: false,
      lastSeen: performance.now()
    };
    remotePlayers5F.set(data.id, rp);
    updatePeerCountUI5F();
  }
  rp.targetPos.set(data.x, data.y, data.z);
  rp.targetYaw = data.yaw;
  rp.moving = !!data.moving;
  rp.lastSeen = performance.now();
}

function removeRemotePlayer5F(peerId) {
  const rp = remotePlayers5F.get(peerId);
  if (rp) {
    scene.remove(rp.mesh);
    remotePlayers5F.delete(peerId);
    updatePeerCountUI5F();
  }
}

function broadcastFromHost5F(payload, excludeId = null) {
  clientConns5F.forEach((conn, id) => {
    if (id !== excludeId && conn.open) conn.send(payload);
  });
}

function handleNetworkPacket5F(data, fromId) {
  if (!data || !data.type) return;
  if (data.type === 'state') {
    upsertRemotePlayer5F(data);
    if (isHost5F) broadcastFromHost5F(data, fromId);
  } else if (data.type === 'chat') {
    appendChat5F(data.name, data.role, data.text, false);
    if (isHost5F) broadcastFromHost5F(data, fromId);
  } else if (data.type === 'leave') {
    removeRemotePlayer5F(data.id);
    if (isHost5F) broadcastFromHost5F(data, fromId);
  }
}

function sendNetworkPacket5F(payload) {
  if (isHost5F) {
    broadcastFromHost5F(payload, null);
  } else if (hostConn5F && hostConn5F.open) {
    hostConn5F.send(payload);
  }
}

function initMultiplayer5F() {
  document.getElementById('mp-badge-card').textContent = `🪪 ${staffAuth5F.card}・${staffAuth5F.name}`;
  if (typeof Peer === 'undefined') return;

  const tryConnectAsClient = () => {
    isHost5F = false;
    peer5F = new Peer({ debug: 0 });
    peer5F.on('open', (id) => {
      myPeerId5F = id;
      hostConn5F = peer5F.connect(ROOM_HOST_ID_5F, { reliable: true });
      hostConn5F.on('open', () => {
        document.getElementById('mp-status-dot').innerHTML = '● 5F 醫療樓層連線正常 (已加入)';
        appendChat5F('', '', '已加入 5F 病房區多人頻道', true);
      });
      hostConn5F.on('data', (d) => handleNetworkPacket5F(d, ROOM_HOST_ID_5F));
      hostConn5F.on('close', () => {
        document.getElementById('mp-badge-card').textContent = `🪪 ${staffAuth5F.name}（${staffAuth5F.role}・${staffAuth5F.card}）`;
        setTimeout(() => { peer5F.destroy(); initMultiplayer5F(); }, 1500);
      });
    });
  };

  // 嘗試搶佔 5F 房間主節點 (Host)
  peer5F = new Peer(ROOM_HOST_ID_5F, { debug: 0 });
  peer5F.on('open', (id) => {
    isHost5F = true;
    myPeerId5F = id;
    document.getElementById('mp-status-dot').innerHTML = '● 5F 房主 (Host)';
    appendChat5F('', '', '您已建立 5F 病房區多人房間', true);
  });

  peer5F.on('connection', (conn) => {
    conn.on('open', () => {
      clientConns5F.set(conn.peer, conn);
    });
    conn.on('data', (d) => handleNetworkPacket5F(d, conn.peer));
    conn.on('close', () => {
      clientConns5F.delete(conn.peer);
      removeRemotePlayer5F(conn.peer);
      broadcastFromHost5F({ type: 'leave', id: conn.peer });
    });
  });

  peer5F.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      peer5F.destroy();
      tryConnectAsClient();
    }
  });

  // 每 60ms 廣播自身座標與狀態（不廣播卡號以保護隱私）
  setInterval(() => {
    if (!myPeerId5F || !player.mesh) return;
    const isMoving = !!(keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD'] || keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight']);
    sendNetworkPacket5F({
      type: 'state',
      id: myPeerId5F,
      name: staffAuth5F.name,
      role: staffAuth5F.role,
      x: Number(player.pos.x.toFixed(3)),
      y: Number(player.pos.y.toFixed(3)),
      z: Number(player.pos.z.toFixed(3)),
      yaw: Number(player.yaw.toFixed(3)),
      moving: isMoving
    });
  }, 60);

  window.addEventListener('beforeunload', () => {
    sendNetworkPacket5F({ type: 'leave', id: myPeerId5F });
  });
}

        if (def.yaw !== undefined) rig.group.rotation.y = def.yaw;

        if (def.isBedridden) {
          rig.group.rotation.order = 'YXZ';
          rig.group.rotation.y = def.yaw || 0;
          rig.group.rotation.x = -Math.PI * 0.48;
          rig.group.position.set(startPos.x, startPos.y + 0.64, startPos.z);
          rig.headGroup.rotation.x = 0.25;
          rig.leftShoulder.rotation.z = 0.12;
          rig.rightShoulder.rotation.z = -0.12;
        } else if (def.isOperatingCart) {
          rig.leftShoulder.rotation.x = -0.85;
          rig.leftElbow.rotation.x = -0.65;
          rig.rightShoulder.rotation.x = -0.92;
          rig.rightElbow.rotation.x = -0.60;
        } else if (def.isCheckingPatient) {
          rig.rightShoulder.rotation.x = -1.15;
          rig.rightElbow.rotation.x = -0.45;
          rig.leftShoulder.rotation.x = -0.55;
          rig.leftElbow.rotation.x = -0.75;
        }

        const nameSprite = createNpcNameSprite(def.name, def.role, def.badgeColor);
        if (def.isBedridden) {
          nameSprite.position.set(0, 0.15, -1.35);
        }
        rig.group.add(nameSprite);
        npcSprites.push(nameSprite);

        const aggroRing = new THREE.Mesh(
          new THREE.RingGeometry(0.45, 0.62, 24),
          new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.FrontSide, transparent: true, opacity: 0.85, depthWrite: false })
        );
        aggroRing.rotation.x = -Math.PI / 2;
        aggroRing.position.y = 0.04;
        aggroRing.visible = false;
        if (!def.isBedridden) {
          rig.group.add(aggroRing);
        }

        const dizzyGroup = new THREE.Group();
        dizzyGroup.position.y = 2.02;
        dizzyGroup.visible = false;
        for (let s = 0; s < 3; s++) {
          const star = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.065, 0),
            new THREE.MeshBasicMaterial({ color: 0xfde047 })
          );
          const ang = (s / 3) * Math.PI * 2;
          star.position.set(Math.cos(ang) * 0.24, 0, Math.sin(ang) * 0.24);
          dizzyGroup.add(star);
        }
        rig.group.add(dizzyGroup);

        scene.add(rig.group);

        npcs.push({
          ...def,
          rig,
          mesh: rig.group,
          aggroRing,
          dizzyGroup,
          pos: rig.group.position,
          yaw: def.yaw || 0,
          radius: def.isBedridden ? 0.15 : def.appearance.hasWheelchair ? 0.56 : 0.40,
          wpIndex: 0,
          walkCycle: Math.random() * Math.PI * 2,
          hp: def.type === 'security' ? 140 : 100,
          maxHp: def.type === 'security' ? 140 : 100,
          knockbackVel: new THREE.Vector3(),
          hurtTimer: 0,
          knockdownTimer: 0,
          isHostile: false,
          aiAttackState: 'idle',
          aiAttackTimer: 0,
          aiDamage: def.type === 'security' ? 16 : def.type === 'staff' ? 12 : 8
        });
      });
    }

    // --------------------------------------------------------------------------
    // 8. 4 子步實體防穿透碰撞求解器 & 多樓層高度計算
    // --------------------------------------------------------------------------
    function resolveCircleAllAABBs(pos, radius, floorNum) {
      for (let i = 0; i < colliders.length; i++) {
        const b = colliders[i];
        if (b.floor !== 0 && b.floor !== floorNum) continue;

        const closestX = THREE.MathUtils.clamp(pos.x, b.minX, b.maxX);
        const closestZ = THREE.MathUtils.clamp(pos.z, b.minZ, b.maxZ);
        const dx = pos.x - closestX;
        const dz = pos.z - closestZ;
        const distSq = dx * dx + dz * dz;

        if (distSq < radius * radius) {
          const dist = Math.sqrt(distSq);
          if (dist > 0.0001) {
            const overlap = radius - dist;
            pos.x += (dx / dist) * overlap;
            pos.z += (dz / dist) * overlap;
          } else {
            const penLeft = Math.abs(pos.x - b.minX);
            const penRight = Math.abs(b.maxX - pos.x);
            const penTop = Math.abs(pos.z - b.minZ);
            const penBottom = Math.abs(b.maxZ - pos.z);
            const minPen = Math.min(penLeft, penRight, penTop, penBottom);
            if (minPen === penLeft) pos.x = b.minX - radius;
            else if (minPen === penRight) pos.x = b.maxX + radius;
            else if (minPen === penTop) pos.z = b.minZ - radius;
            else pos.z = b.maxZ + radius;
          }
        }
      }
    }

    function separateCircles(posA, rA, posB, rB, weightA = 0.5) {
      const dx = posA.x - posB.x;
      const dz = posA.z - posB.z;
      const minDist = rA + rB;
      const distSq = dx * dx + dz * dz;
      if (distSq < minDist * minDist) {
        const dist = Math.sqrt(distSq) || 0.001;
        const overlap = minDist - dist;
        const nx = dx / dist;
        const nz = dz / dist;
        posA.x += nx * overlap * weightA;
        posA.z += nz * overlap * weightA;
        posB.x -= nx * overlap * (1 - weightA);
        posB.z -= nz * overlap * (1 - weightA);
      }
    }

    function getSurfaceHeightAt(x, z, currentY) {
      if (currentY >= 12.4) return 13.8;
      if (currentY >= 7.8) return 9.2;
      return currentY >= 3.2 ? 4.6 : 0.0;
    }

    // --------------------------------------------------------------------------
    // 9. 雙向近戰格鬥系統
    // --------------------------------------------------------------------------
    function spawnSlashTrail(originPos, yaw, colorHex, radius = 1.35) {
      const arcGeom = new THREE.RingGeometry(radius * 0.55, radius, 24, 1, -Math.PI * 0.45, Math.PI * 0.9);
      const arcMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(arcGeom, arcMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = -yaw + Math.PI * 0.5;
      mesh.position.set(originPos.x, originPos.y + 1.15, originPos.z);
      scene.add(mesh);
      slashEffects.push({ mesh, life: 0.24, maxLife: 0.24 });
    }

    function spawnHitSparks(worldPos, colorHex = 0xfbbf24) {
      for (let i = 0; i < 10; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.065, 8, 8),
          new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 })
        );
        p.position.set(worldPos.x, worldPos.y + 1.15, worldPos.z);
        const ang = Math.random() * Math.PI * 2;
        const spd = 2.5 + Math.random() * 4.5;
        scene.add(p);
        hitParticles.push({
          mesh: p,
          vel: new THREE.Vector3(Math.cos(ang) * spd, 2.0 + Math.random() * 3.0, Math.sin(ang) * spd),
          life: 0.35
        });
      }
    }

    function spawnFloatingDamage(worldPos, amount, isPlayerHurt = false) {
      const vec = new THREE.Vector3(worldPos.x, worldPos.y + 2.15, worldPos.z);
      vec.project(camera);
      if (vec.z > 1) return;

      const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-vec.y * 0.5 + 0.5) * window.innerHeight;

      const el = document.createElement('div');
      el.className = 'dmg-float text-lg sm:text-xl';
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.color = isPlayerHurt ? '#fb7185' : '#fde047';
      el.textContent = `-${amount}`;
      document.getElementById('floating-ui-layer').appendChild(el);
      setTimeout(() => el.remove(), 860);
    }

    function triggerPlayerAttack(type = 'light') {
      if (activeTalkNpc) return;
      if (player.isAttacking) return;

      player.isAttacking = true;
      player.attackType = type;
      player.hitRegisteredThisSwing = false;

      if (type === 'light') {
        player.comboStep = (player.comboStep % 3) + 1;
        player.attackDuration = player.comboStep === 3 ? 0.42 : 0.32;
        player.comboResetTimer = 1.1;
      } else {
        player.comboStep = 0;
        player.attackDuration = 0.48;
      }
      player.attackTimer = player.attackDuration;

      SoundFX.playSwing(type === 'heavy');
      spawnSlashTrail(
        player.pos,
        player.yaw,
        type === 'heavy' ? 0xf59e0b : player.comboStep === 3 ? 0xf43f5e : 0x38bdf8,
        type === 'heavy' ? 1.65 : 1.35
      );
    }

    function alertNearbyGuardsAndMakeHostile(targetNpc) {
      if (targetNpc.isBedridden) return;
      targetNpc.isHostile = true;
      targetNpc.aggroRing.visible = true;

      const pFloor = getFloorNumber(player.pos.y);
      npcs.forEach((other) => {
        if (other.floor !== pFloor || other.isBedridden) return;
        const dist = other.pos.distanceTo(targetNpc.pos);
        if (other.type === 'security' && dist < 26) {
          other.isHostile = true;
          other.aggroRing.visible = true;
        } else if (dist < 7.5 && other.knockdownTimer <= 0) {
          other.isHostile = true;
          other.aggroRing.visible = true;
        }
      });

      player.wantedStars = Math.min(5, Math.max(player.wantedStars + 1, 1));
      updateWantedAndHpHUD();
    }

    function damagePlayer(amount, attackerPos) {
      if (player.hurtCooldown > 0) return;
      player.hurtCooldown = 0.48;

      if (player.armor > 0) {
        const absorbed = Math.min(player.armor, amount * 0.65);
        player.armor = Math.max(0, player.armor - absorbed);
        player.hp = Math.max(0, player.hp - (amount - absorbed));
      } else {
        player.hp = Math.max(0, player.hp - amount);
      }

      SoundFX.playPlayerHurt();
      spawnFloatingDamage(player.pos, amount, true);

      const pushX = player.pos.x - attackerPos.x;
      const pushZ = player.pos.z - attackerPos.z;
      const len = Math.hypot(pushX, pushZ) || 1;
      player.pos.x += (pushX / len) * 0.45;
      player.pos.z += (pushZ / len) * 0.45;

      const vig = document.getElementById('damage-vignette');
      vig.style.opacity = '1';
      setTimeout(() => (vig.style.opacity = '0'), 220);

      updateWantedAndHpHUD();

      if (player.hp <= 0) {
        showToast('🚑 生命值歸零！已由向日葵急診室緊急救護並恢復滿血！');
        clearWantedAndHeal();
        player.pos.set(11.5, 0, -14.5);
        player.yaw = Math.PI;
        camState.yaw = camState.targetYaw = Math.PI;
      }
    }

    function updateWantedAndHpHUD() {
      document.getElementById('hud-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById('hud-armor-bar').style.width = `${player.armor}%`;

      // 穩定常亮警星，無高頻閃爍動畫
      const starsEl = document.getElementById('hud-wanted-stars');
      const spans = starsEl.querySelectorAll('span');
      spans.forEach((sp, i) => {
        sp.className = i < player.wantedStars ? 'text-amber-400' : 'text-slate-600';
      });

      const hostileCount = npcs.filter((n) => n.isHostile && n.floor === getFloorNumber(player.pos.y)).length;
      const badge = document.getElementById('hud-combo-badge');
      if (player.wantedStars > 0 || hostileCount > 0) {
        badge.textContent = `🚨 遭反擊警戒中 (${hostileCount}人追擊)`;
        badge.className = 'gta-font gta-shadow text-sm sm:text-base font-bold text-rose-400 leading-tight mt-0.5';
      } else {
        const pFloor = getFloorNumber(player.pos.y);
        const floorTag = pFloor === 5 ? '5F 住院病房層' : pFloor === 3 ? '3F 醫療樓層' : pFloor === 2 ? '2F 醫療樓層' : '1F 門診大廳';
        badge.textContent = `健保卡已連線・${floorTag}`;
        badge.className = 'gta-font gta-shadow text-sm sm:text-base font-bold text-emerald-400 leading-tight mt-0.5';
      }
    }

    // --------------------------------------------------------------------------
    // 11. 每幀物理模擬、電梯自動接觸偵測與免鎖定平滑滑鼠視角更新
    // --------------------------------------------------------------------------
    function updateSimulation(dt) {
      const pFloor = getFloorNumber(player.pos.y);

      if (player.hurtCooldown > 0) player.hurtCooldown = Math.max(0, player.hurtCooldown - dt);
      if (player.comboResetTimer > 0) {
        player.comboResetTimer -= dt;
        if (player.comboResetTimer <= 0) player.comboStep = 0;
      }

      const camSmoothFactor = 1 - Math.exp(-22 * dt);
      camState.yaw += (camState.targetYaw - camState.yaw) * camSmoothFactor;
      camState.pitch += (camState.targetPitch - camState.pitch) * camSmoothFactor;
      camState.distance += (camState.targetDistance - camState.distance) * camSmoothFactor;

      // ------------------ A. 玩家移動與跳躍 ------------------
      let forwardInput = 0;
      let rightInput = 0;
      let keyYawInput = 0;
      if (!activeTalkNpc) {
        if (keys['KeyW'] || keys['ArrowUp']) forwardInput += 1;
        if (keys['KeyS'] || keys['ArrowDown']) forwardInput -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) rightInput += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) rightInput -= 1;
        if (keys['KeyQ'] || keys['Numpad4']) keyYawInput += 1;
        if (keys['Numpad6']) keyYawInput -= 1;
      }

      if (keyYawInput !== 0) {
        camState.targetYaw += keyYawInput * 1.95 * camState.sensitivity * dt;
      }

      const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
      const moveSpeed = isSprinting ? 7.8 : 4.5;

      const camForwardX = -Math.sin(camState.yaw);
      const camForwardZ = -Math.cos(camState.yaw);
      const camRightX = Math.cos(camState.yaw);
      const camRightZ = -Math.sin(camState.yaw);

      let moveX = camForwardX * forwardInput + camRightX * rightInput;
      let moveZ = camForwardZ * forwardInput + camRightZ * rightInput;
      const moveLen = Math.hypot(moveX, moveZ);

      if (moveLen > 0.001) {
        if (player.isKneeling) player.isKneeling = false;
        moveX /= moveLen;
        moveZ /= moveLen;
        const targetYaw = Math.atan2(moveX, moveZ);
        let diff = targetYaw - player.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.yaw += diff * Math.min(1, dt * 16);
      } else if (firstPersonMode) {
        player.yaw = camState.yaw + Math.PI;
      }

      const subSteps = 4;
      const stepDt = dt / subSteps;
      for (let s = 0; s < subSteps; s++) {
        if (moveLen > 0.001) {
          player.pos.x += moveX * moveSpeed * stepDt;
          player.pos.z += moveZ * moveSpeed * stepDt;
        }
        resolveCircleAllAABBs(player.pos, player.radius, pFloor);
      }

      if (!activeTalkNpc && keys['Space'] && player.onGround) {
        player.vel.y = 6.2;
        player.onGround = false;
      }
      player.vel.y -= 18 * dt;
      player.pos.y += player.vel.y * dt;
      const groundY = getSurfaceHeightAt(player.pos.x, player.pos.z, player.pos.y);
      if (player.pos.y <= groundY) {
        player.pos.y = groundY;
        player.vel.y = 0;
        player.onGround = true;
      }

      player.mesh.position.copy(player.pos);
      player.mesh.rotation.y = player.yaw;

      // ------------------ B. 玩家肢體與近戰連擊動畫 ------------------
      if (player.isAttacking) {
        player.attackTimer -= dt;
        const progress = 1 - Math.max(0, player.attackTimer / player.attackDuration);
        const swingCurve = Math.sin(progress * Math.PI);

        if (player.attackType === 'heavy') {
          player.rightShoulder.rotation.x = -2.4 * swingCurve;
          player.rightElbow.rotation.x = -0.8 * swingCurve;
          player.rightFistAura.material.opacity = swingCurve * 0.85;
        } else if (player.comboStep === 1) {
          player.rightShoulder.rotation.x = -1.95 * swingCurve;
          player.rightFistAura.material.opacity = swingCurve * 0.75;
        } else if (player.comboStep === 2) {
          player.leftShoulder.rotation.x = -1.95 * swingCurve;
          player.leftFistAura.material.opacity = swingCurve * 0.75;
        } else {
          player.rightHip.rotation.x = -1.75 * swingCurve;
          player.mesh.rotation.y = player.yaw + progress * Math.PI * 2;
          player.rightFootAura.material.opacity = swingCurve * 0.85;
        }

        if (!player.hitRegisteredThisSwing && progress >= 0.25 && progress <= 0.7) {
          const hitRange = player.attackType === 'heavy' ? 2.15 : 1.75;
          const damage = player.attackType === 'heavy' ? 42 : player.comboStep === 3 ? 32 : 22;
          const forwardDirX = Math.sin(player.yaw);
          const forwardDirZ = Math.cos(player.yaw);

          npcs.forEach((npc) => {
            if (npc.floor !== pFloor || npc.knockdownTimer > 0 || npc.isBedridden) return;
            const toNpcX = npc.pos.x - player.pos.x;
            const toNpcZ = npc.pos.z - player.pos.z;
            const dist = Math.hypot(toNpcX, toNpcZ);
            if (dist <= hitRange) {
              const dot = (toNpcX * forwardDirX + toNpcZ * forwardDirZ) / (dist || 1);
              if (dot > 0.15 || player.comboStep === 3) {
                player.hitRegisteredThisSwing = true;
                npc.hp = Math.max(0, npc.hp - damage);
                npc.hurtTimer = 0.28;
                const kbForce = player.attackType === 'heavy' ? 7.5 : 4.5;
                npc.knockbackVel.set((toNpcX / (dist || 1)) * kbForce, 0, (toNpcZ / (dist || 1)) * kbForce);

                SoundFX.playImpact(player.attackType === 'heavy');
                spawnHitSparks(npc.pos, player.attackType === 'heavy' ? 0xf59e0b : 0x38bdf8);
                spawnFloatingDamage(npc.pos, damage, false);
                alertNearbyGuardsAndMakeHostile(npc);

                if (npc.hp <= 0) {
                  npc.knockdownTimer = 5.5;
                  npc.dizzyGroup.visible = true;
                  showToast(`💥 擊倒了 ${npc.name}！`);
                }
              }
            }
          });
        }

        if (player.attackTimer <= 0) {
          player.isAttacking = false;
          player.rightShoulder.rotation.x = 0;
          player.leftShoulder.rotation.x = 0;
          player.rightElbow.rotation.x = 0;
          player.rightHip.rotation.x = 0;
          player.rightFistAura.material.opacity = 0;
          player.leftFistAura.material.opacity = 0;
          player.rightFootAura.material.opacity = 0;
        }
      } else if (moveLen > 0.001) {
        player.walkCycle += dt * (isSprinting ? 14 : 9.5);
        const swing = Math.sin(player.walkCycle) * (isSprinting ? 0.78 : 0.5);
        player.leftHip.rotation.x = swing;
        player.rightHip.rotation.x = -swing;
        player.leftShoulder.rotation.x = -swing * 0.75;
        player.rightShoulder.rotation.x = swing * 0.75;
      } else {
        player.leftHip.rotation.x *= 0.82;
        player.rightHip.rotation.x *= 0.82;
        player.leftShoulder.rotation.x *= 0.82;
        player.rightShoulder.rotation.x *= 0.82;
      }

      // ------------------ C. NPC 巡邏、床邊/E化車操作動畫與互動偵測 ------------------
      let closestNpc = null;
      let minTalkDist = 2.65;

      npcs.forEach((npc) => {
        npc.walkCycle += dt * 4.2;

        if (npc.isBedridden) {
          npc.rig.headGroup.rotation.y = Math.sin(npc.walkCycle * 0.45) * 0.12;
          if (npc.floor === pFloor) {
            const dToBedPatient = Math.hypot(player.pos.x - npc.pos.x, player.pos.z - npc.pos.z);
            if (dToBedPatient < 2.85 && dToBedPatient < minTalkDist) {
              minTalkDist = dToBedPatient;
              closestNpc = npc;
            }
          }
          return;
        }

        if (npc.knockdownTimer > 0) {
          npc.knockdownTimer -= dt;
          npc.mesh.rotation.x = -Math.PI * 0.46;
          npc.dizzyGroup.rotation.y += dt * 5;
          if (npc.knockdownTimer <= 0) {
            npc.mesh.rotation.x = 0;
            npc.dizzyGroup.visible = false;
            npc.hp = npc.maxHp;
            npc.isHostile = true;
            npc.aggroRing.visible = true;
          }
          return;
        }

        if (npc.knockbackVel.lengthSq() > 0.01) {
          npc.pos.x += npc.knockbackVel.x * dt;
          npc.pos.z += npc.knockbackVel.z * dt;
          npc.knockbackVel.multiplyScalar(Math.max(0, 1 - dt * 9));
          resolveCircleAllAABBs(npc.pos, npc.radius, npc.floor);
        }

        if (npc.isHostile && npc.floor === pFloor && !activeTalkNpc) {
          const toPlayerX = player.pos.x - npc.pos.x;
          const toPlayerZ = player.pos.z - npc.pos.z;
          const distToPlayer = Math.hypot(toPlayerX, toPlayerZ);

          if (distToPlayer > 0.01) {
            npc.yaw = Math.atan2(toPlayerX, toPlayerZ);
          }

          if (npc.aiAttackState === 'idle') {
            if (distToPlayer > 1.35) {
              const chaseSpeed = npc.type === 'security' ? 4.3 : 3.4;
              npc.pos.x += (toPlayerX / distToPlayer) * chaseSpeed * dt;
              npc.pos.z += (toPlayerZ / distToPlayer) * chaseSpeed * dt;
              resolveCircleAllAABBs(npc.pos, npc.radius, npc.floor);

              const swing = Math.sin(npc.walkCycle * 2.4) * 0.55;
              npc.rig.leftHip.rotation.x = swing;
              npc.rig.rightHip.rotation.x = -swing;
              npc.rig.leftShoulder.rotation.x = -swing * 0.7;
              npc.rig.rightShoulder.rotation.x = swing * 0.7;
            } else {
              npc.aiAttackState = 'windup';
              npc.aiAttackTimer = 0.4;
            }
          } else if (npc.aiAttackState === 'windup') {
            npc.aiAttackTimer -= dt;
            npc.rig.rightShoulder.rotation.x = -2.2;
            npc.rig.rightElbow.rotation.x = -0.65;
            if (npc.aiAttackTimer <= 0) {
              npc.aiAttackState = 'strike';
              npc.aiAttackTimer = 0.24;
              spawnSlashTrail(npc.pos, npc.yaw, 0xf43f5e, 1.25);
              if (distToPlayer <= 1.75) {
                damagePlayer(npc.aiDamage, npc.pos);
              }
            }
          } else if (npc.aiAttackState === 'strike') {
            npc.aiAttackTimer -= dt;
            npc.rig.rightShoulder.rotation.x = 0.45;
            if (npc.aiAttackTimer <= 0) {
              npc.aiAttackState = 'cooldown';
              npc.aiAttackTimer = 0.72;
            }
          } else if (npc.aiAttackState === 'cooldown') {
            npc.aiAttackTimer -= dt;
            npc.rig.rightShoulder.rotation.x *= 0.85;
            npc.rig.rightElbow.rotation.x *= 0.85;
            if (npc.aiAttackTimer <= 0) {
              npc.aiAttackState = 'idle';
            }
          }
        } else if (npc.speed > 0 && npc.waypoints.length > 1) {
          const targetWp = npc.waypoints[npc.wpIndex];
          const dx = targetWp.x - npc.pos.x;
          const dz = targetWp.z - npc.pos.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 0.35) {
            npc.wpIndex = (npc.wpIndex + 1) % npc.waypoints.length;
          } else {
            npc.pos.x += (dx / dist) * npc.speed * dt;
            npc.pos.z += (dz / dist) * npc.speed * dt;
            npc.yaw = Math.atan2(dx, dz);
            resolveCircleAllAABBs(npc.pos, npc.radius, npc.floor);

            const swing = Math.sin(npc.walkCycle * 1.6) * 0.42;
            npc.rig.leftHip.rotation.x = swing;
            npc.rig.rightHip.rotation.x = -swing;
            if (!npc.appearance.hasCart) {
              npc.rig.leftShoulder.rotation.x = -swing * 0.65;
              npc.rig.rightShoulder.rotation.x = swing * 0.65;
            }
          }
        } else if (npc.isOperatingCart) {
          npc.rig.rightShoulder.rotation.x = -0.92 + Math.sin(npc.walkCycle * 1.4) * 0.08;
          npc.rig.leftShoulder.rotation.x = -0.85 + Math.cos(npc.walkCycle * 1.1) * 0.06;
          npc.rig.headGroup.rotation.y = Math.sin(npc.walkCycle * 0.6) * 0.14;
        } else if (npc.isCheckingPatient) {
          npc.rig.rightShoulder.rotation.x = -1.15 + Math.sin(npc.walkCycle * 1.2) * 0.12;
          npc.rig.headGroup.rotation.y = Math.sin(npc.walkCycle * 0.7) * 0.16;
        }

        npc.mesh.rotation.y = npc.yaw;

        if (npc.floor === pFloor) {
          separateCircles(player.pos, player.radius, npc.pos, npc.radius, 0.72);
          const dToPlayer = Math.hypot(player.pos.x - npc.pos.x, player.pos.z - npc.pos.z);
          if (dToPlayer < minTalkDist && !npc.isHostile) {
            minTalkDist = dToPlayer;
            closestNpc = npc;
          }
        }
      });

      // ------------------ D-0. 祈禱室／佛堂電動門感應與跪坐祈福 ------------------
      if (prayerAutoDoor.leftLeaf && prayerAutoDoor.rightLeaf) {
        const distToDoor = Math.hypot(player.pos.x - 0, player.pos.z - (-9.4));
        const targetOpen = pFloor === 5 && distToDoor < 3.4 ? 1.05 : 0;
        prayerAutoDoor.openAmount += (targetOpen - prayerAutoDoor.openAmount) * Math.min(1, dt * 7);
        prayerAutoDoor.leftLeaf.position.x = -0.59 - prayerAutoDoor.openAmount;
        prayerAutoDoor.rightLeaf.position.x = 0.59 + prayerAutoDoor.openAmount;
        }
        if (prayerAutoDoor.collider) {
          const isOpen = prayerAutoDoor.openAmount > 0.65;
          prayerAutoDoor.collider.minX = isOpen ? 999 : -1.2;
          prayerAutoDoor.collider.maxX = isOpen ? 999 : 1.2;
        }

      let nearCushion = null;
      if (pFloor === 5) {
        for (const spot of prayerCushionSpots) {
          if (Math.hypot(player.pos.x - spot.x, player.pos.z - spot.z) < 1.25) {
            nearCushion = spot;
            break;
          }
        }
      }

      if (player.isKneeling) {
        player.mesh.position.y = player.pos.y - 0.42;
        player.leftHip.rotation.x = -1.45;
        player.rightHip.rotation.x = -1.45;
        player.leftShoulder.rotation.x = -0.75;
        player.leftShoulder.rotation.z = -0.35;
        player.leftElbow.rotation.x = -1.25;
        player.rightShoulder.rotation.x = -0.75;
        player.rightShoulder.rotation.z = 0.35;
        player.rightElbow.rotation.x = -1.25;
        player.headGroup.rotation.x = 0.18;
      } else {
        player.leftShoulder.rotation.z = 0;
        player.rightShoulder.rotation.z = 0;
        player.headGroup.rotation.x = 0;
      }

      // ------------------ D. 接觸電梯門廳自動詢問樓層並連結 HTML ------------------
      let insideTransport = null;
      for (let i = 0; i < transportTriggers.length; i++) {
        const tz = transportTriggers[i];
        if (tz.floor !== pFloor) continue;
        if (
          player.pos.x >= tz.minX &&
          player.pos.x <= tz.maxX &&
          player.pos.z >= tz.minZ &&
          player.pos.z <= tz.maxZ
        ) {
          insideTransport = tz;
          break;
        }
      }

      if (insideTransport) {
        activeTransportZone = insideTransport;
        if (!transportLockout && !activeTalkNpc) {
          openFloorTransportModal(insideTransport.type, insideTransport.name);
        }
      } else {
        activeTransportZone = null;
        if (!activeTalkNpc) {
          transportLockout = false;
        }
      }

      // 更新互動提示橫幅
      const talkPrompt = document.getElementById('talk-prompt');
      if (!activeTalkNpc && activeTransportZone) {
        talkPrompt.innerHTML = `按 <span class="px-2 py-0.5 mx-1 rounded bg-sky-400 text-slate-950 font-black">E</span> 開啟 <span class="text-teal-300">${activeTransportZone.name}</span>（前往 B1~8F）`;
        talkPrompt.classList.remove('hidden');
        talkPrompt.onclick = () => openFloorTransportModal(activeTransportZone.type, activeTransportZone.name);
      } else if (!activeTalkNpc && closestNpc) {
        talkPrompt.innerHTML = `按 <span class="px-2 py-0.5 mx-1 rounded bg-amber-400 text-slate-950 font-black">E</span> 與 <span class="text-teal-300">${closestNpc.name}</span> 對話`;
        talkPrompt.classList.remove('hidden');
        talkPrompt.onclick = () => openDialogue(closestNpc);
      } else if (!activeTalkNpc && nearCushion) {
        talkPrompt.innerHTML = player.isKneeling
          ? `按 <span class="px-2 py-0.5 mx-1 rounded bg-amber-400 text-slate-950 font-black">E</span> 或移動方向鍵 <span class="text-teal-300">起身</span>`
          : `按 <span class="px-2 py-0.5 mx-1 rounded bg-amber-400 text-slate-950 font-black">E</span> 於蒲團拜墊 <span class="text-amber-300">跪坐祈福</span>`;
        talkPrompt.classList.remove('hidden');
        talkPrompt.onclick = () => {
          player.isKneeling = !player.isKneeling;
          if (player.isKneeling) {
            player.pos.set(nearCushion.x, nearCushion.y, nearCushion.z);
            player.yaw = 0;
            showToast('🙏 已於佛堂蒲團跪坐合十祈福（移動或再按 E 即可起身）');
          }
        };
      } else {
        talkPrompt.classList.add('hidden');
        talkPrompt.onclick = null;
      }

      // ------------------ E. 特效與相機更新 ------------------
      for (let i = slashEffects.length - 1; i >= 0; i--) {
        const ef = slashEffects[i];
        ef.life -= dt;
        ef.mesh.material.opacity = Math.max(0, (ef.life / ef.maxLife) * 0.85);
        ef.mesh.scale.addScalar(dt * 1.4);
        if (ef.life <= 0) {
          scene.remove(ef.mesh);
          slashEffects.splice(i, 1);
        }
      }

      for (let i = hitParticles.length - 1; i >= 0; i--) {
        const pt = hitParticles[i];
        pt.life -= dt;
        pt.vel.y -= 12 * dt;
        pt.mesh.position.addScaledVector(pt.vel, dt);
        pt.mesh.material.opacity = Math.max(0, pt.life / 0.35);
        if (pt.life <= 0) {
          scene.remove(pt.mesh);
          hitParticles.splice(i, 1);
        }
      }

      const eyePos = new THREE.Vector3(player.pos.x, player.pos.y + 1.58, player.pos.z);
      if (firstPersonMode) {
        player.mesh.visible = false;
        camera.position.copy(eyePos);
        const lookDir = new THREE.Vector3(
          -Math.sin(camState.yaw) * Math.cos(camState.pitch),
          -Math.sin(camState.pitch),
          -Math.cos(camState.yaw) * Math.cos(camState.pitch)
        );
        camera.lookAt(eyePos.clone().add(lookDir));
      } else {
        player.mesh.visible = true;
        const desiredLookAt = new THREE.Vector3(player.pos.x, player.pos.y + 1.45, player.pos.z);
        camState.targetPos.lerp(desiredLookAt, 1 - Math.exp(-20 * dt));

        const offsetX = Math.sin(camState.yaw) * Math.cos(camState.pitch) * camState.distance;
        const offsetY = Math.sin(camState.pitch) * camState.distance;
        const offsetZ = Math.cos(camState.yaw) * Math.cos(camState.pitch) * camState.distance;

        const desiredCamPos = new THREE.Vector3(
          camState.targetPos.x + offsetX,
          Math.max(player.pos.y + 0.45, camState.targetPos.y + offsetY),
          camState.targetPos.z + offsetZ
        );

        const wallBounds = { minX: -52.8, maxX: 52.8, minZ: -46.8, maxZ: 44.2 };

        desiredCamPos.x = THREE.MathUtils.clamp(desiredCamPos.x, wallBounds.minX, wallBounds.maxX);
        desiredCamPos.z = THREE.MathUtils.clamp(desiredCamPos.z, wallBounds.minZ, wallBounds.maxZ);
        desiredCamPos.y = Math.min(desiredCamPos.y, groundY + 4.35);

        camera.position.copy(desiredCamPos);
        camera.lookAt(camState.targetPos);
      }

      updateCurrentZoneHUD(pFloor);
    }

      let label = '5F 東側護理站 B・520 病房區';

        if (z < -29.0 && x > 13.4 && x < 19.6) label = '5F 520 雙人住院病房內部（薄荷綠病床・點滴架）';
        else if (z < -29.0 && x > 6.9 && x < 13.1) label = '5F 525 雙人住院病房內部';
        else if (z < -29.0 && x > 19.9 && x < 26.1) label = '5F 519 雙人住院病房內部';

        else if (z < -29.0 && x < -12.9 && x > -19.1) label = '5F 560 雙人住院病房內部';
        else if (z < -10.3 && x > 10 && x < 38) label = '5F 東側護理站 B / C・E化行動護理車・517~527 病房';

        else if (z > -10.3 && z < -4.2 && x < -42.0) label = '5F 537 負壓隔離病房內部（無菌負/負壓照護區）';
        else if (x <= -38) label = '5F 西側病房區 (552~538)・西側電梯廳';

        else if (z > 18 && x >= 16) label = '3F 東南側・班廷俱樂部 & 眼科部';
        else label = '3F 中央醫療大廳・醫師辦公室';
      } else if (pFloor === 2) {
        if (z < -16 && x > 26) label = '2F 洗腎室 / CAPD 中心 (腎臟科 李文清醫師)';
        else if (z < -14 && x >= 0 && x <= 26) label = '2F 開刀房 (OR-1~OR-9) / 麻醉恢復室';
        else if (z < -14 && x < 0) label = '2F 心導管室 / 外科 ICU / 內科 ICU';
        else if (z > 16 && x < -14) label = '2F 婦產科 / 211 LDR / NICU / PICU';
        else if (z > 16 && x >= 20) label = '2F 牙科部 (221~232診間)';
        else label = '2F 中央大廳迴廊';
      } else {
        if (z > 32 && Math.abs(x) < 12) label = '1F 南側入口門廳・疏散看板';
        else if (z > 5 && z <= 16 && Math.abs(x) < 14) label = '1F 中央大廳・批價掛號櫃檯';
        else if (z > 16 && x <= -15) label = '1F 西側門診區 / 義美 / 7-ELEVEN';
        else if (z > 16 && x >= 15) label = '1F 東側門診區 / 85度C / 國際會議廳';
        else if (z < -10 && x < -10) label = '1F 放射科 (MRI / 64切 CT)';

        else if (z < -24 && x > 26) label = '1F 血液透析中心 (1F 洗腎室)';
