      document.getElementById('current-zone-label').textContent = label;
    }

    // --------------------------------------------------------------------------
    // 12. 圓形 1F ~ 5F 緊急疏散平面圖同色系雷達小地圖
    // --------------------------------------------------------------------------
    function renderMinimap() {
      const canvas = document.getElementById('minimap-canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const cx = W / 2;
      const cy = H / 2;
      const scale = 2.6;
      const pFloor = getFloorNumber(player.pos.y);

      document.getElementById('minimap-floor-label').textContent = `${pFloor}F 平面圖雷達`;

      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, W / 2 - 2, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = '#fefce8';
      ctx.fillRect(0, 0, W, H);

      ctx.translate(cx, cy);
      ctx.rotate(camState.yaw);

      const drawZoneRect = (wx, wz, ww, wd, color) => {
        const sx = (wx - player.pos.x) * scale;
        const sy = (wz - player.pos.z) * scale;
        ctx.fillStyle = color;
        ctx.fillRect(sx - (ww * scale) / 2, sy - (wd * scale) / 2, ww * scale, wd * scale);
      };

      if (pFloor === 5) {
        drawZoneRect(-23.5, -18.5, 13.8, 5.2, '#fde68a');
        drawZoneRect(23.5, -18.5, 13.8, 5.2, '#fde68a');
        drawZoneRect(16.5, -33.1, 6.2, 8.2, '#86efac');
        drawZoneRect(23.0, -33.1, 6.2, 8.2, '#a7f3d0');
        drawZoneRect(10.0, -33.1, 6.2, 8.2, '#a7f3d0');
        drawZoneRect(-22.5, -33.1, 6.2, 8.2, '#a7f3d0');
        drawZoneRect(-16.0, -33.1, 6.2, 8.2, '#a7f3d0');
        drawZoneRect(-32.3, -33.4, 13.3, 8.7, '#fbcfe8');
        drawZoneRect(32.6, -33.4, 12.8, 8.7, '#fbcfe8');
        drawZoneRect(-46.5, -7.2, 9.6, 6.4, '#93c5fd');
        drawZoneRect(-26.5, -7.2, 31.0, 6.2, '#fbcfe8');
        drawZoneRect(31.5, -7.2, 41.0, 6.2, '#fbcfe8');
        drawZoneRect(0, -18.5, 13.5, 4.6, '#bae6fd');
        drawZoneRect(0, -6.8, 12.0, 5.2, '#fde68a');
        drawZoneRect(0, -5.0, 3.2, 0.95, '#b45309');
        drawZoneRect(0, 34.5, 22.0, 14.0, '#bae6fd');
      } else if (pFloor === 3) {
        drawZoneRect(-21.5, -34.5, 38.0, 12.5, '#bae6fd');
        drawZoneRect(-32.5, -12.5, 26.0, 7.5, '#fbcfe8');
        drawZoneRect(24.5, -34.5, 34.0, 12.5, '#fed7aa');
        drawZoneRect(24.5, -12.5, 34.0, 7.5, '#a7f3d0');
        drawZoneRect(-33.5, 31.5, 28.0, 14.5, '#fbcfe8');
        drawZoneRect(33.5, 31.5, 28.0, 14.5, '#fbcfe8');
        drawZoneRect(0, 36.5, 22.0, 14.0, '#bae6fd');
      } else if (pFloor === 2) {
        drawZoneRect(38.5, -36.5, 22.0, 18.0, '#fbcfe8');
        drawZoneRect(14.5, -26.5, 22.0, 17.5, '#a7f3d0');
        drawZoneRect(-16.5, -26.5, 28.0, 17.5, '#bae6fd');
        drawZoneRect(-26.5, 29.5, 24.0, 14.5, '#fbcfe8');
        drawZoneRect(-44.5, 26.5, 14.0, 18.0, '#bae6fd');
        drawZoneRect(36.5, 28.5, 22.0, 16.5, '#fbcfe8');
      } else {
        drawZoneRect(-23.5, 27.5, 10.5, 15.5, '#fbcfe8');
        drawZoneRect(23.5, 27.5, 10.5, 15.5, '#fbcfe8');
        drawZoneRect(-11.5, 29.5, 7.5, 11.5, '#fed7aa');
        drawZoneRect(11.5, 29.5, 7.5, 11.5, '#fed7aa');
        drawZoneRect(-26.5, -6.5, 19.5, 8.5, '#a7f3d0');
        drawZoneRect(24.5, -6.5, 18.5, 8.5, '#a7f3d0');
        drawZoneRect(-24.5, -24.5, 24.0, 14.5, '#bae6fd');
        drawZoneRect(14.5, -24.5, 22.0, 14.5, '#fecdd3');
        drawZoneRect(38.5, -36.5, 22.0, 18.0, '#fbcfe8');
      }

      transportTriggers.forEach((tz) => {
        if (tz.floor !== pFloor) return;
        const tx = ((tz.minX + tz.maxX) * 0.5 - player.pos.x) * scale;
        const ty = ((tz.minZ + tz.maxZ) * 0.5 - player.pos.z) * scale;
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(tx - 4.5, ty - 4.5, 9, 9);
      });

      npcs.forEach((npc) => {
        if (npc.floor !== pFloor) return;
        const nx = (npc.pos.x - player.pos.x) * scale;
        const ny = (npc.pos.z - player.pos.z) * scale;
        ctx.fillStyle = npc.isHostile ? '#ef4444' : npc.isBedridden ? '#f59e0b' : npc.type === 'security' ? '#2563eb' : '#0d9488';
        ctx.beginPath();
        ctx.arc(nx, ny, 3.6, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(6, 7);
      ctx.lineTo(0, 4);
      ctx.lineTo(-6, 7);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // --------------------------------------------------------------------------
    // 13. 事件監聽綁定 (免鎖定滑鼠拖曳轉向 + 單擊近戰 + 鍵盤樓層快捷鍵)
    // --------------------------------------------------------------------------
    function setupInputsAndUI() {
      const canvas = document.getElementById('game-canvas');

      window.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.id === 'mp-chat-input') {
          if (e.code === 'Enter') document.getElementById('mp-chat-send').click();
          return;
        }

        if (e.code === 'Escape') {
          if (activeTalkNpc) closeDialogue();
          return;
        }

        if (activeTalkNpc && activeTalkNpc.isTransport) {
          const digitMap = {
            Digit0: 'B1', Numpad0: 'B1',
            Digit1: '1F', Numpad1: '1F',
            Digit2: '2F', Numpad2: '2F',
            Digit3: '3F', Numpad3: '3F',
            Digit5: '5F', Numpad5: '5F',
            Digit6: '6F', Numpad6: '6F',
            Digit7: '7F', Numpad7: '7F',
            Digit8: '8F', Numpad8: '8F'
          };
          const code = digitMap[e.code];
          if (code) {
            const targetItem = FLOOR_LINKS.find((f) => f.code === code);
            if (targetItem) navigateToFloorHtml(targetItem, '醫療電梯');
            return;
          }
        }

        keys[e.code] = true;

        if (e.code === 'KeyE') {
          const promptBtn = document.getElementById('talk-prompt');
          if (!promptBtn.classList.contains('hidden') && promptBtn.onclick) {
            promptBtn.onclick();
          }
        } else if (e.code === 'KeyJ' || e.code === 'KeyZ') {
          triggerPlayerAttack('light');
        } else if (e.code === 'KeyK' || e.code === 'KeyX') {
          triggerPlayerAttack('heavy');
        } else if (e.code === 'KeyC') {
          clearWantedAndHeal();
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      window.addEventListener('blur', () => {
        Object.keys(keys).forEach((k) => { keys[k] = false; });
        camState.isRightDragging = false;
        camState.isLeftDragging = false;
        camState.lastClientX = null;
        camState.lastClientY = null;
      });

      document.addEventListener('contextmenu', (e) => {
        if (e.target === canvas) e.preventDefault();
      });

      canvas.addEventListener('mousedown', (e) => {
        if (activeTalkNpc) return;
        camState.lastClientX = e.clientX;
        camState.lastClientY = e.clientY;
        camState.dragMovedDist = 0;

        if (e.button === 0) {
          camState.isLeftDragging = true;
        } else if (e.button === 2) {
          camState.isRightDragging = true;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (activeTalkNpc) return;
        if (!camState.isLeftDragging && !camState.isRightDragging) return;

        if (camState.lastClientX === null) {
          camState.lastClientX = e.clientX;
          camState.lastClientY = e.clientY;
          return;
        }

        const dx = e.clientX - camState.lastClientX;
        const dy = e.clientY - camState.lastClientY;
        camState.lastClientX = e.clientX;
        camState.lastClientY = e.clientY;
        camState.dragMovedDist += Math.hypot(dx, dy);

        const sens = 0.0042 * camState.sensitivity;
        camState.targetYaw -= dx * sens;
        const maxPitch = firstPersonMode ? 0.72 : 0.82;
        const minPitch = firstPersonMode ? -0.62 : -0.18;
        camState.targetPitch = THREE.MathUtils.clamp(camState.targetPitch + dy * sens, minPitch, maxPitch);
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
          if (camState.isLeftDragging && camState.dragMovedDist < 6 && !activeTalkNpc) {
            triggerPlayerAttack('light');
          }
          camState.isLeftDragging = false;
        } else if (e.button === 2) {
          camState.isRightDragging = false;
        }
      });

      canvas.addEventListener('wheel', (e) => {
        if (firstPersonMode) return;
        camState.targetDistance = THREE.MathUtils.clamp(camState.targetDistance + e.deltaY * 0.0038, 1.8, 11.5);
      }, { passive: true });

      let lastTouchX = null;
      let lastTouchY = null;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && lastTouchX !== null) {
          const dx = e.touches[0].clientX - lastTouchX;
          const dy = e.touches[0].clientY - lastTouchY;
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
          const sens = 0.005 * camState.sensitivity;
          camState.targetYaw -= dx * sens;
          camState.targetPitch = THREE.MathUtils.clamp(camState.targetPitch + dy * sens, -0.18, 0.82);
        }
      }, { passive: true });

      document.getElementById('dlg-close').addEventListener('click', closeDialogue);
      document.getElementById('btn-attack-light').addEventListener('click', () => triggerPlayerAttack('light'));
      document.getElementById('btn-attack-heavy').addEventListener('click', () => triggerPlayerAttack('heavy'));

      document.querySelectorAll('.touch-dir').forEach((btn) => {
        const k = btn.dataset.key;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
      });

      setInterval(() => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('hud-clock').textContent = `${hh}:${mm}`;
      }, 1000);
    }

    // --------------------------------------------------------------------------
    // 14. 初始化 Three.js 場景、抗閃頻渲染器設定與主渲染迴圈
    // --------------------------------------------------------------------------
    function initScene() {
      const canvas = document.getElementById('game-canvas');
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b131e);
      scene.fog = new THREE.Fog(0x0b131e, 72, 165);

      // 縮窄 near=0.5, far=180 以最大化標準 Z-buffer 深度精度，杜絕遠景閃爍
      camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 180);

      const hemiLight = new THREE.HemisphereLight(0xfffbeb, 0x94a3b8, 0.92);
      hemiLight.position.set(0, 26, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xfff7ed, 0.72);
      dirLight.position.set(28, 42, 24);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      dirLight.shadow.normalBias = 0.02;
      dirLight.shadow.camera.near = 5;
      dirLight.shadow.camera.far = 115;
      const d = 52;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const corridorFillCoords = [
        [0, 16.5, -24.5],
        [-23.5, 16.5, -24.5],
        [23.5, 16.5, -24.5],
        [16.5, 16.5, -33.0],
        [-22.5, 16.5, -33.0],
        [0, 16.5, 34.5]
      ];
      corridorFillCoords.forEach(([lx, ly, lz]) => {
        const ptLight = new THREE.PointLight(0xfff7ed, 0.55, 28, 1.5);
        ptLight.position.set(lx, ly, lz);
        scene.add(ptLight);
      });

      buildHospital1FInterior();
      createPlayableCharacter();
      spawnAllNpcs();
      setupInputsAndUI();
      initMultiplayer5F();

      document.getElementById('mp-chat-send').addEventListener('click', () => {
  const input = document.getElementById('mp-chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  appendChat5F(staffAuth5F.name, staffAuth5F.role, text, false);
  sendNetworkPacket5F({
    type: 'chat',
    name: staffAuth5F.name,
    role: staffAuth5F.role,
    text
  });
});

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const overlay = document.getElementById('loading-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 550);

      showToast('🏥 已進入 5F 住院病房・高級亮面水磨石醫療防滑磁磚地坪（無閃頻穩定版）！');
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // ▼▼▼ 加在這裡 ▼▼▼
      const nowMs = performance.now();
      remotePlayers5F.forEach((rp, id) => {
        if (nowMs - rp.lastSeen > 8000) { removeRemotePlayer5F(id); return; }
        rp.mesh.position.lerp(rp.targetPos, Math.min(1, dt * 14));
        rp.mesh.rotation.y += (rp.targetYaw - rp.mesh.rotation.y) * Math.min(1, dt * 14);
        if (rp.moving) {
          rp.walkCycle += dt * 10;
          const sw = Math.sin(rp.walkCycle) * 0.5;
          rp.rig.leftHip.rotation.x = sw;
          rp.rig.rightHip.rotation.x = -sw;
          rp.rig.leftShoulder.rotation.x = -sw * 0.7;
          rp.rig.rightShoulder.rotation.x = sw * 0.7;
        } else {
          rp.rig.leftHip.rotation.x *= 0.82;
          rp.rig.rightHip.rotation.x *= 0.82;
        }
      });

      updateSimulation(dt);
      renderMinimap();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initScene();
      animate();
    });
  </script>
</body>
