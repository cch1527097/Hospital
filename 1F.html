<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>向日葵醫院-模擬人生</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Three.js r128 穩定 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts: 繁體中文思源黑體 & GTA 風格數字字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b131e;
      font-family: 'Noto Sans TC', sans-serif;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #game-canvas:active {
      cursor: grabbing;
    }
    .gta-font {
      font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
      letter-spacing: 0.04em;
    }
    .gta-shadow {
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
    }
    /* 60FPS 效能優化：移除耗費 GPU 的 backdrop-filter: blur，改用高質感深色漸層底色 */
    .hud-glass {
      background: linear-gradient(145deg, rgba(12, 20, 34, 0.92), rgba(18, 29, 48, 0.90));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    #minimap-shell {
      box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.94), 0 0 0 6px rgba(45, 212, 191, 0.48), 0 12px 30px rgba(0, 0, 0, 0.7);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .npc-nameplate {
      position: fixed;
      top: 0;
      left: 0;
      background: rgba(16, 24, 39, 0.92);
      border: 1.5px solid #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.24), 0 6px 16px rgba(0, 0, 0, 0.55);
      color: #f8fafc;
      padding: 4px 12px 5px 12px;
      border-radius: 13px;
      white-space: nowrap;
      text-align: center;
      will-change: transform, opacity;
      pointer-events: none;
    }
    .npc-nameplate .np-title {
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      line-height: 1.25;
    }
    .npc-nameplate .np-sub {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.25px;
      color: #7dd3fc;
      margin-top: 1px;
      line-height: 1.2;
    }
    /* 護理師：粉紅雙層微光框 */
    .npc-nameplate.pink-plate {
      border-color: #f472b6;
      box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.26), 0 6px 16px rgba(0, 0, 0, 0.55);
    }
    .npc-nameplate.pink-plate .np-sub {
      color: #fbcfe8;
    }
    /* 醫師 / 技術師 / 警衛 / EMT：青綠雙層微光框 */
    .npc-nameplate.teal-plate {
      border-color: #2dd4bf;
      box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.26), 0 6px 16px rgba(0, 0, 0, 0.55);
    }
    .npc-nameplate.teal-plate .np-sub {
      color: #5eead4;
    }
    /* 民眾 / 患者：暖金雙層微光框 */
    .npc-nameplate.amber-plate {
      border-color: #fbbf24;
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.24), 0 6px 16px rgba(0, 0, 0, 0.55);
    }
    .npc-nameplate.amber-plate .np-sub {
      color: #fde68a;
    }

    @keyframes floatPrompt {
      0%, 100% { transform: translate(-50%, 0px); }
      50% { transform: translate(-50%, -4px); }
    }
    .prompt-float {
      animation: floatPrompt 1.6s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <!-- 主 3D 渲染畫布 -->
  <canvas id="game-canvas"></canvas>

  <!-- 自由視角鎖定時的中央準心 -->
  <div id="pointer-lock-reticle" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none flex items-center justify-center">
    <div class="w-2.5 h-2.5 rounded-full bg-teal-300/90 border border-slate-950 shadow-[0_0_8px_#2dd4bf]"></div>
  </div>

  <!-- 樓層 / 大門跳轉轉場遮罩 -->
  <div id="redirect-overlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/95 text-white transition-opacity duration-300">
    <div class="w-14 h-14 border-4 border-teal-400 border-t-amber-400 rounded-full animate-spin mb-4"></div>
    <h2 id="redirect-title" class="text-xl sm:text-2xl font-black text-teal-300 tracking-wide">正在前往目標樓層...</h2>
    <p id="redirect-sub" class="text-xs sm:text-sm text-slate-300 mt-1">自動連結中</p>
  </div>

  <!-- 載入遮罩 -->
  <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-white transition-opacity duration-500">
    <div class="w-16 h-16 border-4 border-amber-400 border-t-teal-400 rounded-full animate-spin mb-4"></div>
    <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-amber-300 mb-1">向日葵醫院-模擬人生</h1>
    <p class="text-xs sm:text-sm text-slate-300">正在載入...</p>
  </div>

  <!-- 右上角：GTA 風格狀態欄 -->
  <div class="fixed top-3 right-3 sm:right-4 z-20 flex flex-col items-end pointer-events-none">
    <div id="hud-clock" class="gta-font gta-shadow text-xl sm:text-2xl font-bold text-white leading-none">
      10:25
    </div>
    <div id="hud-combo-badge" class="gta-font gta-shadow text-sm sm:text-base font-bold text-emerald-400 leading-tight mt-0.5">
      健保卡已連線
    </div>

    <!-- 生命值 & 護甲狀態條 -->
    <div class="mt-1.5 w-36 sm:w-44 space-y-1">
      <div class="w-full h-3 bg-black/75 rounded-sm p-0.5 border border-black">
        <div id="hud-health-bar" class="h-full bg-gradient-to-r from-red-600 to-rose-400 transition-all duration-150" style="width: 100%;"></div>
      </div>
      <div class="w-full h-2.5 bg-black/75 rounded-sm p-0.5 border border-black">
        <div id="hud-armor-bar" class="h-full bg-gradient-to-r from-sky-600 to-cyan-400 transition-all duration-150" style="width: 90%;"></div>
      </div>
    </div>

    <!-- 五星通緝等級 -->
    <div id="hud-wanted-stars" class="mt-1.5 flex items-center gap-1 text-base sm:text-lg gta-shadow">
      <span class="text-slate-500">★</span>
      <span class="text-slate-500">★</span>
      <span class="text-slate-500">★</span>
      <span class="text-slate-500">★</span>
      <span class="text-slate-500">★</span>
    </div>

    <!-- 目前所在空間徽章 -->
    <div class="mt-1.5 px-3 py-1 rounded-xl hud-glass border-l-4 border-amber-400 text-right shadow-lg">
      <div class="text-[10px] text-slate-400 font-medium">現在位置 You Are Here</div>
      <div id="current-zone-label" class="text-xs sm:text-sm font-black text-white">南側入口大門廳 (大門內側)</div>
    </div>
  </div>

  <!-- 浮動傷害數字、音符與 NPC 雙行發光銘牌覆蓋層 -->
  <div id="floating-fx-layer" class="fixed inset-0 z-10 pointer-events-none overflow-hidden"></div>

  <!-- 中央下方：深色青綠雙層發光膠囊互動提示條 -->
  <button id="npc-talk-prompt" class="hidden fixed bottom-36 sm:bottom-12 left-1/2 z-20 px-5 py-2.5 rounded-2xl text-white font-bold text-xs sm:text-sm prompt-float cursor-pointer" style="background: rgba(16, 24, 39, 0.94); border: 2px solid #2dd4bf; box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.25), 0 10px 25px rgba(0,0,0,0.65);">
    按 <span class="px-2 py-0.5 mx-1 rounded-md bg-emerald-400 text-slate-950 font-black">E</span> 與 <span id="prompt-npc-name" class="text-amber-300">護理師</span> 交談
  </button>

  <!-- 樓層選擇互動視窗 Modal (接觸手扶梯 / 電梯時自動彈出) -->
  <div id="floor-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/75">
    <div class="hud-glass w-full max-w-md rounded-2xl p-5 text-white border border-amber-400/50 shadow-2xl">
      <div class="flex items-center justify-between gap-3 pb-3 border-b border-white/15">
        <div class="flex items-center gap-3">
          <div id="floor-modal-icon" class="w-11 h-11 rounded-full bg-amber-500/25 border border-amber-300/50 flex items-center justify-center text-2xl">
            🛗
          </div>
          <div>
            <h3 id="floor-modal-title" class="font-black text-base sm:text-lg text-amber-300">搭乘電梯／手扶梯</h3>
            <p id="floor-modal-subtitle" class="text-xs text-teal-300 font-medium">請問您要前往哪一樓層？</p>
          </div>
        </div>
        <button id="floor-modal-close" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-rose-500/80 text-xs font-bold transition">
          留在 1F (ESC)
        </button>
      </div>

      <p class="mt-3 text-xs sm:text-sm text-slate-200">
        請點選目標樓層，系統將自動為您連結至該樓層空間：
      </p>

      <!-- B1, 1F, 2F, 3F, 5F, 6F, 7F, 8F 八大樓層按鈕網格 -->
      <div id="floor-grid" class="mt-3.5 grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <button data-floor="B1" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">B1</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">美食街/放腫</span>
        </button>

        <button data-floor="1F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-teal-900/70 hover:bg-teal-500 hover:text-slate-950 border-2 border-teal-400 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-teal-200 group-hover:text-slate-950">1F</span>
          <span class="text-[10px] text-teal-300 group-hover:text-slate-900 mt-0.5 font-bold">大廳/急診(本層)</span>
        </button>

        <button data-floor="2F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">2F</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">門診/健檢中心</span>
        </button>

        <button data-floor="3F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">3F</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">手術室/加護</span>
        </button>

        <button data-floor="5F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">5F</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">綜合病房區</span>
        </button>

        <button data-floor="6F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">6F</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">內外科病房</span>
        </button>

        <button data-floor="7F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">7F</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">特等病房區</span>
        </button>

        <button data-floor="8F" class="floor-choice-btn group flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/90 hover:bg-teal-500 hover:text-slate-950 border border-teal-400/35 transition shadow-md cursor-pointer">
          <span class="gta-font text-xl font-black text-amber-300 group-hover:text-slate-950">8F</span>
          <span class="text-[10px] text-slate-300 group-hover:text-slate-900 mt-0.5 font-bold">VIP 病房/花園</span>
        </button>
      </div>
    </div>
  </div>

  <!-- NPC 對話視窗 Modal -->
  <div id="dialogue-modal" class="hidden fixed inset-0 z-40 flex items-end sm:items-center justify-center p-4 bg-black/70">
    <div class="hud-glass w-full max-w-lg rounded-2xl p-5 text-white border border-teal-400/40 shadow-2xl">
      <div class="flex items-center justify-between gap-3 pb-3 border-b border-white/15">
        <div class="flex items-center gap-3">
          <div id="dlg-avatar" class="w-11 h-11 rounded-full bg-teal-500/25 border border-teal-300/40 flex items-center justify-center text-2xl">
            🩺
          </div>
          <div>
            <h3 id="dlg-name" class="font-black text-base sm:text-lg text-amber-300">陳建宏 主治醫師</h3>
            <p id="dlg-role" class="text-xs text-teal-300 font-medium">內科門診・主治醫師</p>
          </div>
        </div>
        <button id="dlg-close-btn" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-rose-500/80 text-xs font-bold transition">
          關閉 (ESC / E)
        </button>
      </div>

      <p id="dlg-text" class="mt-4 text-sm sm:text-base leading-relaxed text-slate-100">
        您好！歡迎來到向日葵醫院。
      </p>

      <div id="dlg-options" class="mt-4 flex flex-col gap-2"></div>
    </div>
  </div>

<!-- 1F 室內多人連線狀態與聊天面板 (左下角小地圖上方) -->
<div id="multiplayer-panel" class="fixed bottom-44 sm:bottom-52 left-4 z-20 w-64 sm:w-72 hud-glass rounded-xl p-2.5 text-white shadow-xl pointer-events-auto border border-teal-400/35">
  <div class="flex items-center justify-between border-b border-white/10 pb-1.5 mb-1.5">
    <div class="flex items-center gap-1.5">
      <span id="mp-status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
      <span id="mp-status-text" class="text-[11px] font-bold text-teal-300">正在連線至 1F 大廳...</span>
    </div>
    <span id="mp-online-count" class="px-1.5 py-0.5 rounded bg-teal-500/20 text-[10px] font-bold text-teal-300">1 人在線</span>
  </div>
  <!-- 1F 線上玩家名單 -->
  <div id="mp-player-list" class="text-[10px] text-slate-300 max-h-14 overflow-y-auto space-y-0.5 mb-1.5"></div>
  <!-- 1F 簡易即時頻道 -->
  <div id="mp-chat-box" class="h-16 overflow-y-auto bg-black/40 rounded p-1.5 text-[11px] space-y-1 mb-1.5 select-text">
    <div class="text-slate-400">系統：歡迎進入 1F 醫療大樓大廳！</div>
  </div>
  <form id="mp-chat-form" class="flex gap-1">
    <input id="mp-chat-input" type="text" maxlength="50" placeholder="按 Enter 發送訊息..." class="flex-1 bg-slate-900/90 border border-white/15 rounded px-2 py-1 text-[11px] text-white focus:border-teal-400 focus:outline-none" />
    <button type="submit" class="px-2 py-1 rounded bg-teal-600 hover:bg-teal-500 text-[11px] font-bold">送出</button>
  </form>
</div>

  <!-- 左下角：1F 緊急疏散平面圖同色系圓形雷達小地圖 -->
  <div id="minimap-shell" class="fixed bottom-4 left-4 z-20 w-36 h-36 sm:w-44 sm:h-44 rounded-full overflow-hidden bg-amber-50">
    <canvas id="minimap-canvas" width="200" height="200" class="w-full h-full block"></canvas>
    <div class="absolute top-1 left-1/2 -translate-x-1/2 px-1.5 rounded bg-slate-900/85 text-[10px] font-black text-teal-300 pointer-events-none">
      N
    </div>
    <div class="absolute bottom-1 left-1/2 -translate-x-1/2 px-2 py-0.2 rounded-full bg-slate-900/85 text-[9px] font-bold text-white pointer-events-none">
      1F 平面圖雷達
    </div>
  </div>

  <!-- 右下角：近戰攻擊按鈕組、衝刺與行動端虛擬方向鍵 -->
  <div class="fixed bottom-3 right-3 sm:bottom-4 sm:right-4 z-20 flex flex-col items-end gap-2">
    <div class="flex items-center gap-2">
      <button id="btn-action-heavy" class="px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-xs sm:text-sm shadow-[0_6px_20px_rgba(245,158,11,0.5)] border border-amber-200/60 active:scale-95 transition">
        💥 旋風重踢 / 處決 (K)
      </button>
      <button id="btn-action-attack" class="px-4 py-2.5 sm:px-5 sm:py-3 rounded-2xl bg-gradient-to-br from-rose-500 to-red-700 hover:from-rose-400 hover:to-red-600 text-white font-black text-xs sm:text-sm shadow-[0_6px_20px_rgba(225,29,72,0.55)] border border-rose-300/60 active:scale-95 transition">
        👊 四段連擊 (J)
      </button>
    </div>

    <!-- 行動裝置虛擬方向鍵與衝刺/跳躍/對話 -->
    <div class="md:hidden flex flex-col items-end gap-1.5">
      <div class="flex gap-1.5">
        <button id="btn-touch-sprint" class="px-3 h-10 rounded-full hud-glass text-sky-300 font-bold text-xs active:scale-95">⚡ 衝刺</button>
        <button id="btn-touch-talk" class="px-3 h-10 rounded-full hud-glass text-emerald-300 font-bold text-xs active:scale-95">互動 E</button>
        <button id="btn-touch-jump" class="px-3 h-10 rounded-full hud-glass text-amber-300 font-bold text-xs active:scale-95">跳躍</button>
      </div>
      <div class="grid grid-cols-3 gap-1 w-32 h-32">
        <div></div>
        <button data-key="KeyW" class="touch-pad rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">▲</button>
        <div></div>
        <button data-key="KeyA" class="touch-pad rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">◀</button>
        <button data-key="KeyS" class="touch-pad rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">▼</button>
        <button data-key="KeyD" class="touch-pad rounded-xl hud-glass text-white font-bold text-base active:bg-teal-500/50">▶</button>
      </div>
    </div>
  </div>

  <script>

// ==========================================================================
// 0. 強制檢查員工刷卡登入狀態（支援 URL 參數與 sessionStorage）
// ==========================================================================
const loginParams1F = new URLSearchParams(window.location.search);
let currentUserSession1F = null;
try {
  currentUserSession1F = JSON.parse(sessionStorage.getItem('vh_user_session'));
} catch (e) {}

const authCard = loginParams1F.get('card') || (currentUserSession1F && currentUserSession1F.cardNumber);
const authName = loginParams1F.get('name') || (currentUserSession1F && currentUserSession1F.staffName);
const authRole = loginParams1F.get('role') || (currentUserSession1F && currentUserSession1F.roleId) || 'nurse';

if (!authCard || !authName) {
  alert('⚠️ 門禁系統提示：請先於入口大門刷卡驗證員工識別證！');
  window.location.href = 'index.html';
} else {
  // 寫回 sessionStorage，確保在 1F 與戶外之間切換時登入狀態不遺失
  try {
    sessionStorage.setItem('vh_user_session', JSON.stringify({
      cardNumber: authCard,
      staffName: authName,
      roleId: authRole
    }));

function createNameTag1F(staffName, roleLabel) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(10, 17, 26, 0.82)';
  ctx.beginPath();
  ctx.roundRect(46, 18, 420, 92, 24);
  ctx.fill();
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.font = '900 34px "Noto Sans TC", sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.textAlign = 'center';
  ctx.fillText(staffName, 256, 58);

  ctx.font = 'bold 22px "Noto Sans TC", sans-serif';
  ctx.fillStyle = '#5eead4';
  ctx.fillText(roleLabel, 256, 94);

  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.1, 0.52, 1);
  sprite.position.set(0, 2.05, 0);
  return sprite;
}

function upsertRemotePlayer1F(peerId, state) {
  if (!peerId || peerId === (peer1F && peer1F.id) || !scene) return;

  let rp = remotePlayers1F.get(peerId);
  if (!rp) {
    const built = buildRemoteCharacter1F(state.roleId);
    const tag = createNameTag1F(state.name || '院內同仁', built.roleLabel);
    built.group.add(tag);
    built.group.position.set(state.x || 0, state.y || 0, state.z || 39.5);
    scene.add(built.group);

    rp = {
      id: peerId,
      group: built.group,
      parts: built,
      name: state.name,
      targetPos: new THREE.Vector3(state.x, state.y, state.z),
      targetYaw: state.yaw || 0,
      isMoving: false,
      walkCycle: 0
    };
    remotePlayers1F.set(peerId, rp);
    appendChat1F('系統', `${state.name} (${built.roleLabel}) 進入了 1F 大廳！`, 'text-teal-300');
    updateOnlineList1F();
  }

  rp.targetPos.set(state.x, state.y, state.z);
  rp.targetYaw = state.yaw;
  rp.isMoving = state.isMoving;
}

function removeRemotePlayer1F(peerId) {
  const rp = remotePlayers1F.get(peerId);
  if (rp) {
    scene.remove(rp.group);
    appendChat1F('系統', `${rp.name} 已離開 1F 大廳。`, 'text-slate-400');
    remotePlayers1F.delete(peerId);
    updateOnlineList1F();
  }
}

function broadcastFromHost1F(packet, excludePeerId = null) {

  });
}

function initMultiplayer1F() {
  const statusDot = document.getElementById('mp-status-dot');
  const statusText = document.getElementById('mp-status-text');
  updateOnlineList1F();

  const peerConfig = {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  };

  const getMyStatePacket = () => ({
    type: 'state',
    peerId: peer1F.id,
    payload: {
      x: Number(player.pos.x.toFixed(2)),
      y: Number(player.pos.y.toFixed(2)),
      z: Number(player.pos.z.toFixed(2)),
      yaw: Number(player.yaw.toFixed(2)),
      roleId: authRole,
      name: authName,
      isMoving: Math.hypot(player.vel.x, player.vel.z) > 0.25
    }
  });

  peer1F = new Peer(ROOM_HOST_ID_1F, { debug: 0 });

  peer1F.on('open', () => {
    isHost1F = true;
    if (statusDot) statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
    if (statusText) statusText.textContent = '1F 大廳連線正常 (主節點)';
    appendChat1F('系統', `已開啟 1F 大廳連線頻道，歡迎 ${authName}！`, 'text-teal-300');
  });

peer1F.on('connection', (conn) => {
    clientConns1F.set(conn.peer, conn);

    // 【關鍵修正 1】當新玩家連線通道一開啟，房主立刻把自己的位置傳給他
    conn.on('open', () => {
      if (player.mesh) {
        conn.send(getMyStatePacket());
      }
    });

    conn.on('data', (data) => {
      if (data.type === 'state') {
        upsertRemotePlayer1F(conn.peer, data.payload);
        // 轉發給其他所有玩家（並確保帶上正確的 peerId）
        broadcastFromHost1F({ ...data, peerId: conn.peer }, conn.peer);
      } else if (data.type === 'chat') {
        appendChat1F(data.sender, data.text);
        broadcastFromHost1F(data, conn.peer);
      }
    });

    conn.on('close', () => {
      clientConns1F.delete(conn.peer);
      removeRemotePlayer1F(conn.peer);
      broadcastFromHost1F({ type: 'leave', peerId: conn.peer });
    });
  });

  peer1F.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      peer1F.destroy();
      peer1F = new Peer(undefined, peerConfig);
      peer1F.on('open', () => {
        // 改用 reliable: true 避免初始封包遺失
        hostConn1F = peer1F.connect(ROOM_HOST_ID_1F, { reliable: true });
        hostConn1F.on('open', () => {
          if (statusDot) statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          if (statusText) statusText.textContent = '1F 大廳連線正常 (已加入)';
          appendChat1F('系統', '已成功連線至 1F 醫療大樓大廳！', 'text-teal-300');

          // 【關鍵修正 2】連上房主瞬間，立刻發送自己的初始座標
          if (player.mesh) {
            hostConn1F.send(getMyStatePacket());
          }
        });

        hostConn1F.on('data', (data) => {
          if (data.type === 'state') {
            upsertRemotePlayer1F(data.peerId, data.payload);
          } else if (data.type === 'chat') {
            appendChat1F(data.sender, data.text);
          } else if (data.type === 'leave') {
            removeRemotePlayer1F(data.peerId);
          }
        });

        hostConn1F.on('close', () => {
          if (statusDot) statusDot.className = 'w-2 h-2 rounded-full bg-rose-500';
          if (statusText) statusText.textContent = '與 1F 主機斷線';
        });
      });
    }
  });

  // 聊天室送出事件
  const chatForm = document.getElementById('mp-chat-form');
  const chatInput = document.getElementById('mp-chat-input');
  if (chatForm && chatInput) {
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = chatInput.value.trim();
      if (!msg) return;
      chatInput.value = '';
      appendChat1F(authName, msg, 'text-sky-200');
      const packet = { type: 'chat', sender: authName, text: msg, peerId: peer1F.id };
      if (isHost1F) {
        broadcastFromHost1F(packet);
      } else if (hostConn1F && hostConn1F.open) {
        hostConn1F.send(packet);
      }
    });
  }

  // 每 60ms 同步一次自身在 1F 的座標與朝向
  setInterval(() => {
    if (!peer1F || !peer1F.id || !player.mesh) return;
    const packet = getMyStatePacket();
    if (isHost1F) {
      broadcastFromHost1F(packet);
    } else if (hostConn1F && hostConn1F.open) {
      hostConn1F.send(packet);
    }
  }, 60);
}

function updateRemotePlayers1F(dt) {
  remotePlayers1F.forEach((rp) => {
    rp.group.position.lerp(rp.targetPos, Math.min(1, dt * 12));
    let diff = rp.targetYaw - rp.group.rotation.y;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    rp.group.rotation.y += diff * Math.min(1, dt * 12);

    if (rp.isMoving) {
      rp.walkCycle += dt * 10;
      const swing = Math.sin(rp.walkCycle) * 0.55;
      rp.parts.leftLeg.rotation.x = swing;
      rp.parts.rightLeg.rotation.x = -swing;
      rp.parts.leftArm.rotation.x = -swing * 0.75;
      rp.parts.rightArm.rotation.x = swing * 0.75;
    } else {
      rp.parts.leftLeg.rotation.x *= 0.85;
      rp.parts.rightLeg.rotation.x *= 0.85;
      rp.parts.leftArm.rotation.x *= 0.85;
      rp.parts.rightArm.rotation.x *= 0.85;
    }
  });
}

    // --------------------------------------------------------------------------
    // 1. Web Audio API 程序化音效合成器
    // --------------------------------------------------------------------------
    const SoundFX = {
      ctx: null,
      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playWhoosh(heavy = false) {
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(heavy ? 185 : 270, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      },
      playHit(isHeavy = false, isKO = false) {
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isHeavy ? 155 : 125, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + (isKO ? 0.32 : 0.18));
        gain.gain.setValueAtTime(isHeavy ? 0.42 : 0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (isKO ? 0.34 : 0.19));
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + (isKO ? 0.35 : 0.2));
      },
      playSirenChirp() {
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.14);
        osc.frequency.linearRampToValueAtTime(620, now + 0.28);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.31);
      },
      playElevatorDing() {
        this.ensureContext();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [880, 1174.66].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.16);
          gain.gain.setValueAtTime(0.18, now + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.16);
          osc.stop(now + idx * 0.16 + 0.46);
        });
      },
      playPianoNote(noteIdx = 0) {
        this.ensureContext();
        if (!this.ctx) return;
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        const freq = scale[noteIdx % scale.length];
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.86);
      }
    };

    function moveEntityWithCollision(pos, dx, dz, radius, selfNpc = null) {
      pos.x += dx;
      pos.z += dz;
      resolveCircleAABB(pos, radius);
      resolveCharacterCollisions(pos, radius, selfNpc);
    }

    function resolveCharacterCollisions(pos, radius, selfNpc = null) {
      if (selfNpc !== null) {
        const dxP = pos.x - player.pos.x;
        const dzP = pos.z - player.pos.z;
        const minDistP = radius + player.radius;
        const distSqP = dxP * dxP + dzP * dzP;

        if (distSqP < minDistP * minDistP) {
          const dist = Math.sqrt(distSqP) || 0.0001;
          const overlap = minDistP - dist;
          const nx = dxP / dist;
          const nz = dzP / dist;

          const selfAnchored = selfNpc.isSeated || selfNpc.isWheelchair || selfNpc.isDoingCPR ||
                               selfNpc.isMedicalAttending || selfNpc.isDrawingBlood ||
                               selfNpc.isHavingBloodDrawn || selfNpc.isSupinePatient || selfNpc.patrolRadius === 0;
          if (selfAnchored) {
            player.pos.x -= nx * overlap;
            player.pos.z -= nz * overlap;
            resolveCircleAABB(player.pos, player.radius);
          } else {
            pos.x += nx * overlap * 0.65;
            pos.z += nz * overlap * 0.65;
            player.pos.x -= nx * overlap * 0.35;
            player.pos.z -= nz * overlap * 0.35;
            resolveCircleAABB(player.pos, player.radius);
          }
        }
      }

      for (let i = 0; i < npcs.length; i++) {
        const other = npcs[i];
        if (other === selfNpc || other.state === 'ko' || other.isSupinePatient) continue;

        const otherRadius = other.isWheelchair ? 0.56 : 0.42;
        const minDist = radius + otherRadius;
        const dx = pos.x - other.pos.x;
        const dz = pos.z - other.pos.z;
        const distSq = dx * dx + dz * dz;

        if (distSq < minDist * minDist) {
          const dist = Math.sqrt(distSq) || 0.0001;
          const overlap = minDist - dist;
          const nx = dx / dist;
          const nz = dz / dist;

          const otherAnchored = other.isSeated || other.isWheelchair || other.isDoingCPR ||
                                other.isMedicalAttending || other.isDrawingBlood ||
                                other.isHavingBloodDrawn || other.patrolRadius === 0;

          if (selfNpc === null || otherAnchored) {
            pos.x += nx * overlap;
            pos.z += nz * overlap;
          } else {
            pos.x += nx * overlap * 0.5;
            pos.z += nz * overlap * 0.5;
            other.pos.x -= nx * overlap * 0.5;
            other.pos.z -= nz * overlap * 0.5;
            resolveCircleAABB(other.pos, otherRadius);
          }
        }
      }
    }

    // --------------------------------------------------------------------------
    // 3. 程序化高解析貼圖（含「向日葵醫院」品牌形象牆貼圖）
    // --------------------------------------------------------------------------
    function createCloverHospitalBrandWallTexture() {
      const w = 2048;
      const h = 440;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, '#f6efe4');
      bgGrad.addColorStop(0.5, '#fcf9f3');
      bgGrad.addColorStop(1, '#efe5d6');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, h * 0.78);
      ctx.bezierCurveTo(w * 0.30, h * 0.56, w * 0.68, h * 0.94, w, h * 0.68);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      const waveGrad = ctx.createLinearGradient(0, 0, w, 0);
      waveGrad.addColorStop(0, 'rgba(16, 185, 129, 0.14)');
      waveGrad.addColorStop(0.5, 'rgba(20, 184, 166, 0.22)');
      waveGrad.addColorStop(1, 'rgba(5, 150, 105, 0.14)');
      ctx.fillStyle = waveGrad;
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = '#b48a4e';
      ctx.lineWidth = 8;
      ctx.strokeRect(14, 14, w - 28, h - 28);
      ctx.strokeStyle = '#0f766e';
      ctx.lineWidth = 3;
      ctx.strokeRect(26, 26, w - 52, h - 52);

      const cx = 560;
      const cy = h * 0.47;

      // 1. 暖金色光暈背景
      const haloGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, 138);
      haloGrad.addColorStop(0, 'rgba(245, 158, 11, 0.28)');
      haloGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = haloGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 138, 0, Math.PI * 2);
      ctx.fill();

      // 2. 外圈暖金細框
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(cx, cy, 114, 0, Math.PI * 2);
      ctx.stroke();

      // 3. 下方綠色花梗與葉片
      ctx.save();
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx, cy + 45);
      ctx.quadraticCurveTo(cx + 12, cy + 84, cx + 36, cy + 112);
      ctx.stroke();

      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.ellipse(cx + 28, cy + 88, 18, 9, -0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 4. 外層向日葵花瓣（16 瓣）
      const petalCount = 16;
      for (let i = 0; i < petalCount; i++) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((i * Math.PI * 2) / petalCount);
        ctx.fillStyle = i % 2 === 0 ? '#fbbf24' : '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(0, -68, 13, 32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. 內層亮黃向日葵花瓣（交錯 16 瓣）
      for (let i = 0; i < petalCount; i++) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(((i + 0.5) * Math.PI * 2) / petalCount);
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.ellipse(0, -56, 10, 24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 6. 深琥珀色向日葵花蕊
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(cx, cy, 44, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 7. 中央白色醫療十字標誌
      ctx.save();
      ctx.shadowColor = 'rgba(6, 78, 59, 0.45)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 11, cy - 28, 22, 56);
      ctx.fillRect(cx - 28, cy - 11, 56, 22);
      ctx.restore();

      const textX = 720;

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.16)';
      ctx.font = '900 128px "Noto Sans TC", sans-serif';

    function addWall(cx, cz, w, d, h = 4.4, mat = null, label = '牆面', castShadow = false) {
      const material = mat || getCachedStandardMat(0xe6dfd3, 0.55, 0.05);
      const mesh = new THREE.Mesh(getCachedBoxGeom(w, h, d), material);
      mesh.position.set(cx, h / 2, cz);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      mesh.matrixAutoUpdate = false;

        maxZ: cz + d / 2,
        label
      });
      return mesh;
    }

    function addAutoSlidingDoorUnit(options) {
      const {
        x,
        z,
        axis = 'x',
        openingWidth = 3.6,
        doorHeight = 2.85,
        wallMat,
        glassMat,
        darkFrameMat,
        sensorColor = 0x22c55e,
        triggerRadius = 4.6,
        slideDist = 1.48
      } = options;

      const g = new THREE.Group();
      const leafWidth = openingWidth / 2;

      const headerHeight = 4.4 - doorHeight;
      const headerW = axis === 'x' ? openingWidth + 0.4 : 0.60;
      const headerD = axis === 'x' ? 0.60 : openingWidth + 0.4;
      const headerMesh = new THREE.Mesh(getCachedBoxGeom(headerW, headerHeight, headerD), wallMat);
      headerMesh.position.set(0, doorHeight + headerHeight / 2, 0);
      g.add(headerMesh);

      const trackW = axis === 'x' ? openingWidth + 0.2 : 0.30;
      const trackD = axis === 'x' ? 0.30 : openingWidth + 0.2;
      const topTrack = new THREE.Mesh(getCachedBoxGeom(trackW, 0.18, trackD), darkFrameMat);
      topTrack.position.set(0, doorHeight + 0.09, 0);
      g.add(topTrack);

      const sensorMat = new THREE.MeshStandardMaterial({
        color: sensorColor,
        emissive: sensorColor,
        emissiveIntensity: 0.95
      });
      const sensorBox = new THREE.Mesh(
        getCachedBoxGeom(axis === 'x' ? 0.45 : 0.36, 0.09, axis === 'x' ? 0.36 : 0.45),
        sensorMat
      );
      sensorBox.position.set(0, doorHeight + 0.22, 0);
      g.add(sensorBox);

      [-openingWidth / 2, openingWidth / 2].forEach((offset) => {
        const jamb = new THREE.Mesh(getCachedBoxGeom(0.18, doorHeight, 0.28), darkFrameMat);
        if (axis === 'x') jamb.position.set(offset, doorHeight / 2, 0);
        else jamb.position.set(0, doorHeight / 2, offset);
        g.add(jamb);
      });

      function createDoorLeaf() {
        const leafGroup = new THREE.Group();
        const paneW = axis === 'x' ? leafWidth : 0.08;
        const paneD = axis === 'x' ? 0.08 : leafWidth;
        const pane = new THREE.Mesh(getCachedBoxGeom(paneW, doorHeight - 0.06, paneD), glassMat);
        pane.position.y = doorHeight / 2;

        const stripe = new THREE.Mesh(
          getCachedBoxGeom(axis === 'x' ? leafWidth - 0.06 : 0.09, 0.14, axis === 'x' ? 0.09 : leafWidth - 0.06),
          sensorMat
        );
        stripe.position.y = 1.15;

        const topBar = new THREE.Mesh(
          getCachedBoxGeom(axis === 'x' ? leafWidth : 0.11, 0.08, axis === 'x' ? 0.11 : leafWidth),
          darkFrameMat
        );
        topBar.position.y = doorHeight - 0.04;

        leafGroup.add(pane, stripe, topBar);
        return leafGroup;
      }

      const leafA = createDoorLeaf();
      const leafB = createDoorLeaf();
      const closedOffset = leafWidth / 2;

      if (axis === 'x') {
        leafA.position.set(-closedOffset, 0, 0);
        leafB.position.set(closedOffset, 0, 0);
      } else {
        leafA.position.set(0, 0, -closedOffset);
        leafB.position.set(0, 0, closedOffset);
      }

      g.add(leafA, leafB);
      g.position.set(x, 0, z);
      scene.add(g);

      autoSlidingDoors.push({
        x,
        z,
        axis,
        leafA,
        leafB,
        closedOffset,
        slideDist,
        triggerRadius
      });
    }

    function updateAutoSlidingDoors(dt) {
      for (let i = 0; i < autoSlidingDoors.length; i++) {
        const d = autoSlidingDoors[i];
        let shouldOpen = Math.hypot(player.pos.x - d.x, player.pos.z - d.z) < d.triggerRadius;

        if (!shouldOpen) {
          for (let j = 0; j < npcs.length; j++) {
            const npc = npcs[j];
            if (npc.isSeated || npc.isSupinePatient) continue;
            if (Math.hypot(npc.pos.x - d.x, npc.pos.z - d.z) < d.triggerRadius * 0.85) {
              shouldOpen = true;
              break;
            }
          }
        }

        const targetOffset = d.closedOffset + (shouldOpen ? d.slideDist : 0);
        if (d.axis === 'x') {
          d.leafA.position.x = THREE.MathUtils.lerp(d.leafA.position.x, -targetOffset, 8 * dt);
          d.leafB.position.x = THREE.MathUtils.lerp(d.leafB.position.x, targetOffset, 8 * dt);
        } else {
          d.leafA.position.z = THREE.MathUtils.lerp(d.leafA.position.z, -targetOffset, 8 * dt);
          d.leafB.position.z = THREE.MathUtils.lerp(d.leafB.position.z, targetOffset, 8 * dt);
        }
      }
    }

    const _escDummy = new THREE.Object3D();
    function updateEscalator(dt) {
      if (!escalatorAnim.stepBodyMesh || !escalatorAnim.stepTrimMesh) return;

      const t = clock.elapsedTime * escalatorAnim.speed;
      const n = escalatorAnim.stepsPerLane;
      const x0 = escalatorAnim.xStart;
      const x1 = escalatorAnim.xEnd;
      const y0 = escalatorAnim.yStart;
      const y1 = escalatorAnim.yEnd;

      for (let laneIdx = 0; laneIdx < 2; laneIdx++) {
        const z = laneIdx === 0 ? 13.95 : 16.05;
        const dir = laneIdx === 0 ? 1 : -1;

        for (let i = 0; i < n; i++) {
          const idx = laneIdx * n + i;
          const raw = (i / n + t * dir) % 1;
          const u = raw < 0 ? raw + 1 : raw;

          const sx = x0 + (x1 - x0) * u;
          const sy = y0 + (y1 - y0) * u;

          _escDummy.position.set(sx, sy - 0.11, z);
          _escDummy.rotation.set(0, 0, 0);
          _escDummy.updateMatrix();
          escalatorAnim.stepBodyMesh.setMatrixAt(idx, _escDummy.matrix);

          _escDummy.position.set(sx, sy + 0.005, z);
          _escDummy.updateMatrix();
          escalatorAnim.stepTrimMesh.setMatrixAt(idx, _escDummy.matrix);
        }
      }

      escalatorAnim.stepBodyMesh.instanceMatrix.needsUpdate = true;
      escalatorAnim.stepTrimMesh.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < escalatorAnim.handrailMarkers.length; i++) {
        const hm = escalatorAnim.handrailMarkers[i];
        const raw = (hm.phaseOffset + t * hm.dir) % 1;
        const u = raw < 0 ? raw + 1 : raw;
        hm.mesh.position.x = (u - 0.5) * hm.span;
      }
    }

    function createFaceTexture(opts = {}) {
      const {
        eyeColor = '#1e293b',
        blush = true,
        expression = 'smile'
      } = opts;

      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, size, size);

      if (blush) {
        const drawBlush = (bx, by) => {
          const grad = ctx.createRadialGradient(bx, by, 2, bx, by, 20);
          grad.addColorStop(0, 'rgba(251, 113, 133, 0.52)');
          grad.addColorStop(1, 'rgba(251, 113, 133, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(bx, by, 20, 0, Math.PI * 2);
          ctx.fill();
        };
        drawBlush(78, 152);
        drawBlush(178, 152);
      }

      if (expression === 'supine') {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(92, 132, 11, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(164, 132, 11, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();

        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(118, 168);
        ctx.lineTo(138, 168);
        ctx.stroke();
      } else {
        const drawEye = (ex, ey) => {
          ctx.fillStyle = eyeColor;
          ctx.beginPath();
          ctx.ellipse(ex, ey, 10, 12.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ex - 3.5, ey - 4.5, 4.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex + 3.2, ey + 3.2, 2.0, 0, Math.PI * 2);
          ctx.fill();
        };
        drawEye(92, 132);
        drawEye(164, 132);

        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(92, 110, 12, Math.PI * 1.18, Math.PI * 1.82);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(164, 110, 12, Math.PI * 1.18, Math.PI * 1.82);
        ctx.stroke();

        ctx.strokeStyle = '#9f1239';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (expression === 'serious') {
          ctx.arc(128, 166, 11, 0.15 * Math.PI, 0.85 * Math.PI);
        } else {
          ctx.arc(128, 160, 14, 0.15 * Math.PI, 0.85 * Math.PI);
        }
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function createCapsuleUniformTexture(options = {}) {
      const {
        baseColor = '#ffffff',
        accentColor = '#0284c7',
        trimColor = '#38bdf8',
        style = 'doctor',
        badgeText = 'CLOVER'
      } = options;

      const w = 512;
      const h = 256;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, w, h);

      const cx = w * 0.5;

      if (style === 'doctor') {
        ctx.fillStyle = accentColor;
        ctx.beginPath();
        ctx.moveTo(cx - 56, 0);
        ctx.lineTo(cx + 56, 0);
        ctx.lineTo(cx, 128);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(cx - 10, 26);
        ctx.lineTo(cx + 10, 26);
        ctx.lineTo(cx + 14, 108);
        ctx.lineTo(cx, 122);
        ctx.lineTo(cx - 14, 108);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 58, 4);
        ctx.lineTo(cx - 10, 128);
        ctx.lineTo(cx - 10, h);
        ctx.moveTo(cx + 58, 4);
        ctx.lineTo(cx + 10, 128);
        ctx.lineTo(cx + 10, h);
        ctx.stroke();

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(cx - 84, 72, 42, 22);
        ctx.fillStyle = trimColor;
        ctx.fillRect(cx - 84, 72, 10, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText(badgeText, cx - 70, 86);

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 3;
        ctx.strokeRect(cx + 34, 144, 46, 52);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(cx + 44, 134, 7, 16);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(cx + 56, 136, 7, 14);
      } else if (style === 'nurse') {
        ctx.fillStyle = trimColor;
        ctx.beginPath();
        ctx.moveTo(cx - 58, 0);
        ctx.lineTo(cx + 58, 0);
        ctx.lineTo(cx, 88);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(cx - 42, 0);
        ctx.lineTo(cx + 42, 0);
        ctx.lineTo(cx, 66);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = trimColor;
        ctx.fillRect(0, 186, w, 16);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 80, 74, 40, 20);
        ctx.strokeStyle = trimColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(cx - 80, 74, 40, 20);
      } else if (style === 'radiology') {
        ctx.fillStyle = trimColor;
        ctx.fillRect(0, 0, w, 24);
        ctx.fillRect(0, 178, w, 20);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(cx - 78, 72, 46, 22);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('MRI / CT', cx - 74, 86);

        ctx.fillStyle = '#facc15';
        ctx.fillRect(cx + 42, 135, 22, 34);
      } else if (style === 'guard') {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, 26);

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(cx - 56, 74, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 182, w, 26);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(cx - 18, 178, 36, 34);
      } else if (style === 'patient_gown') {
        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, 18);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 5;
        for (let sx = 0; sx < w; sx += 38) {
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(sx, h);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = accentColor;
        ctx.fillRect(0, 0, w, 28);
        ctx.fillStyle = trimColor;
        ctx.fillRect(cx - 12, 28, 24, h - 28);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(0, 178, w, 14);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function buildHumanRig(options = {}) {
      const {
        skinColor = 0xffdbac,
        hairColor = 0x1e293b,
        shirtColor = 0xffffff,
        shirtAccent = 0x0284c7,
        shirtTrim = 0x38bdf8,
        uniformStyle = 'casual',
        pantsColor = 0x334155,
        shoeColor = 0xf8fafc,
        isFemale = false,
        hasNurseCap = false,
        hasDoctorCoat = false,
        hasGuardCap = false,
        hasGlasses = false,
        isSupine = false,
        scale = 1.0,
        combatGlow = false
      } = options;

      const root = new THREE.Group();
      const bodyRoot = new THREE.Group();
      root.add(bodyRoot);

      const skinMat = getCachedStandardMat(skinColor, 0.36, 0.04);
      const hairMat = getCachedStandardMat(hairColor, 0.45, 0.06);
      const pantsMat = getCachedStandardMat(pantsColor, 0.45, 0.05);
      const shoeMat = getCachedStandardMat(shoeColor, 0.30, 0.10);
      const whiteTrimMat = getCachedStandardMat(0xffffff, 0.25, 0.08);
      const darkRimMat = getCachedStandardMat(0x0f172a, 0.30, 0.35);

      const uniformTex = createCapsuleUniformTexture({
        baseColor: '#' + new THREE.Color(shirtColor).getHexString(),
        accentColor: '#' + new THREE.Color(shirtAccent).getHexString(),
        trimColor: '#' + new THREE.Color(shirtTrim).getHexString(),
        style: uniformStyle
      });
      const torsoMat = new THREE.MeshStandardMaterial({
        map: uniformTex,
        roughness: 0.38,
        metalness: 0.05
      });

      const sleeveMat = getCachedStandardMat(hasDoctorCoat ? 0xffffff : shirtColor, 0.38, 0.05);

      // 1. 圓潤骨盆連接段
      const pelvisGroup = new THREE.Group();
      pelvisGroup.position.set(0, 0.60, 0);
      const pelvisCyl = new THREE.Mesh(capsuleGeoCache.pelvisCyl, pantsMat);
      const pelvisBot = new THREE.Mesh(capsuleGeoCache.pelvisCap, pantsMat);
      pelvisBot.position.y = -0.05;
      pelvisGroup.add(pelvisCyl, pelvisBot);
      bodyRoot.add(pelvisGroup);

      // 2. 圓潤膠囊軀幹
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(0, 0.88, 0);

      const torsoCyl = new THREE.Mesh(capsuleGeoCache.torsoCyl, torsoMat);
      torsoCyl.rotation.y = -Math.PI / 2;
      torsoCyl.castShadow = true;

      const torsoTopCap = new THREE.Mesh(capsuleGeoCache.torsoCap, sleeveMat);
      torsoTopCap.position.y = 0.22;

      const torsoBotCap = new THREE.Mesh(capsuleGeoCache.torsoCap, sleeveMat);
      torsoBotCap.position.y = -0.22;

      torsoGroup.add(torsoCyl, torsoTopCap, torsoBotCap);

      if (hasDoctorCoat) {
        const stethMat = getCachedStandardMat(0x0f172a, 0.35, 0.4);
        const stethArc = new THREE.Mesh(
          new THREE.TorusGeometry(0.115, 0.014, 8, 16, Math.PI * 1.15),
          stethMat
        );
        stethArc.rotation.x = Math.PI * 0.46;
        stethArc.rotation.z = Math.PI * 0.92;
        stethArc.position.set(0, 0.23, 0.13);
        torsoGroup.add(stethArc);
      }

      bodyRoot.add(torsoGroup);

      // 3. 可愛大頭積木公仔頭部
      const headPivot = new THREE.Group();
      headPivot.position.set(0, 1.38, 0);

      const headBall = new THREE.Mesh(capsuleGeoCache.head, skinMat);
      headBall.castShadow = true;
      headPivot.add(headBall);

      const faceTex = createFaceTexture({
        blush: true,
        expression: isSupine ? 'supine' : (hasGuardCap ? 'serious' : 'smile')
      });
      const faceMat = new THREE.MeshBasicMaterial({
        map: faceTex,
        transparent: true,
        depthWrite: false
      });
      const faceDecal = new THREE.Mesh(
        new THREE.SphereGeometry(0.217, 20, 16, -Math.PI * 0.35, Math.PI * 0.70, Math.PI * 0.22, Math.PI * 0.56),
        faceMat
      );
      faceDecal.rotation.y = -Math.PI / 2;
      headPivot.add(faceDecal);

      const hairCap = new THREE.Mesh(capsuleGeoCache.hairCap, hairMat);
      hairCap.rotation.x = -0.18;
      headPivot.add(hairCap);

      if (isFemale) {
        const bunGeo = getCachedSphereGeom(0.088, 12, 10);
        const bunL = new THREE.Mesh(bunGeo, hairMat);
        bunL.position.set(-0.18, 0.10, -0.12);
        const bunR = new THREE.Mesh(bunGeo, hairMat);
        bunR.position.set(0.18, 0.10, -0.12);
        headPivot.add(bunL, bunR);
      }

      if (hasNurseCap) {
        const capBase = new THREE.Mesh(capsuleGeoCache.nurseCap, whiteTrimMat);
        capBase.position.set(0, 0.235, 0.02);
        const capTop = new THREE.Mesh(capsuleGeoCache.nurseCapTop, whiteTrimMat);
        capTop.position.set(0, 0.255, 0.02);
        const redCross = new THREE.Mesh(
          getCachedBoxGeom(0.055, 0.018, 0.015),
          getCachedStandardMat(0xf43f5e, 0.3, 0.1)
        );
        redCross.position.set(0, 0.242, 0.108);
        const redCrossV = new THREE.Mesh(
          getCachedBoxGeom(0.018, 0.055, 0.015),
          getCachedStandardMat(0xf43f5e, 0.3, 0.1)
        );
        redCrossV.position.set(0, 0.242, 0.108);
        headPivot.add(capBase, capTop, redCross, redCrossV);
      }

      if (hasGuardCap) {
        const visor = new THREE.Mesh(
          getCachedCylinderGeom(0.23, 0.23, 0.05, 16),
          darkRimMat
        );
        visor.position.set(0, 0.15, 0.03);
        const badge = new THREE.Mesh(
          getCachedSphereGeom(0.032, 8, 8),
          getCachedStandardMat(0xfacc15, 0.25, 0.8)
        );
        badge.position.set(0, 0.19, 0.22);
        headPivot.add(visor, badge);
      }

      if (hasGlasses) {
        const visorGlassMat = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          emissive: 0x0284c7,
          emissiveIntensity: 0.45,
          transparent: true,
          opacity: 0.72,
          roughness: 0.15,
          side: THREE.DoubleSide
        });
        const visorBand = new THREE.Mesh(capsuleGeoCache.visorBand, visorGlassMat);
        visorBand.rotation.y = Math.PI;
        visorBand.position.set(0, 0.01, 0);

        const visorTopRim = new THREE.Mesh(capsuleGeoCache.visorRim, darkRimMat);
        visorTopRim.rotation.y = Math.PI;
        visorTopRim.position.set(0, 0.044, 0);

        const visorBotRim = new THREE.Mesh(capsuleGeoCache.visorRim, darkRimMat);
        visorBotRim.rotation.y = Math.PI;
        visorBotRim.position.set(0, -0.024, 0);

        headPivot.add(visorBand, visorTopRim, visorBotRim);
      }

      bodyRoot.add(headPivot);

      // 4. 圓潤膠囊雙臂
      let rightFistAura = null;
      let leftFistAura = null;

      function createCapsuleArm(isLeft) {
        const side = isLeft ? -1 : 1;
        const shoulderPivot = new THREE.Group();
        shoulderPivot.position.set(side * 0.275, 1.08, 0);

        const shoulderBall = new THREE.Mesh(capsuleGeoCache.shoulderBall, sleeveMat);
        shoulderPivot.add(shoulderBall);

        const upperArm = new THREE.Mesh(capsuleGeoCache.upperArmCyl, sleeveMat);
        upperArm.position.y = -0.105;
        shoulderPivot.add(upperArm);

        const elbowPivot = new THREE.Group();
        elbowPivot.position.set(0, -0.21, 0);

        const elbowBall = new THREE.Mesh(capsuleGeoCache.elbowBall, sleeveMat);
        elbowPivot.add(elbowBall);

        const foreArm = new THREE.Mesh(capsuleGeoCache.foreArmCyl, sleeveMat);
        foreArm.position.y = -0.10;
        elbowPivot.add(foreArm);

        const cuffRing = new THREE.Mesh(capsuleGeoCache.cuffRing, whiteTrimMat);
        cuffRing.rotation.x = Math.PI / 2;
        cuffRing.position.y = -0.195;
        elbowPivot.add(cuffRing);

        const handBall = new THREE.Mesh(capsuleGeoCache.handBall, skinMat);
        handBall.position.y = -0.235;
        elbowPivot.add(handBall);

        if (combatGlow) {
          const auraMat = new THREE.MeshBasicMaterial({
            color: isLeft ? 0x38bdf8 : 0xf59e0b,
            transparent: true,
            opacity: 0.0
          });
          const aura = new THREE.Mesh(capsuleGeoCache.combatAuraBall, auraMat);
          aura.position.y = -0.235;
          elbowPivot.add(aura);
          if (isLeft) leftFistAura = aura;
          else rightFistAura = aura;
        }

        shoulderPivot.add(elbowPivot);
        return { shoulderPivot, elbowPivot };
      }

      const leftArm = createCapsuleArm(true);
      const rightArm = createCapsuleArm(false);
      bodyRoot.add(leftArm.shoulderPivot, rightArm.shoulderPivot);

      // 5. 圓潤膠囊雙腿與雙色積木運動鞋
      let rightFootAura = null;

      function createCapsuleLeg(isLeft) {
        const side = isLeft ? -1 : 1;
        const hipPivot = new THREE.Group();
        hipPivot.position.set(side * 0.115, 0.54, 0);

        const thigh = new THREE.Mesh(capsuleGeoCache.thighCyl, pantsMat);
        thigh.position.y = -0.135;
        hipPivot.add(thigh);

        const kneePivot = new THREE.Group();
        kneePivot.position.set(0, -0.27, 0);

        const kneeBall = new THREE.Mesh(capsuleGeoCache.kneeBall, pantsMat);
        kneePivot.add(kneeBall);

        const shin = new THREE.Mesh(capsuleGeoCache.shinCyl, pantsMat);
        shin.position.y = -0.135;
        kneePivot.add(shin);

        const shoeGroup = new THREE.Group();
        shoeGroup.position.set(0, -0.265, 0.035);

        const shoeBody = new THREE.Mesh(capsuleGeoCache.shoeBody, shoeMat);
        const shoeToe = new THREE.Mesh(capsuleGeoCache.shoeToe, shoeMat);
        shoeToe.scale.set(1.0, 0.62, 1.05);
        shoeToe.position.set(0, -0.008, 0.088);

        const shoeHeel = new THREE.Mesh(capsuleGeoCache.shoeHeel, shoeMat);
        shoeHeel.scale.set(1.0, 0.62, 0.95);
        shoeHeel.position.set(0, -0.008, -0.085);

        const soleStrip = new THREE.Mesh(
          getCachedBoxGeom(0.14, 0.022, 0.28),
          whiteTrimMat
        );
        soleStrip.position.set(0, -0.042, 0.005);

        shoeGroup.add(shoeBody, shoeToe, shoeHeel, soleStrip);
        kneePivot.add(shoeGroup);

        if (combatGlow && !isLeft) {
          const footAuraMat = new THREE.MeshBasicMaterial({
            color: 0xf43f5e,
            transparent: true,
            opacity: 0.0
          });
          rightFootAura = new THREE.Mesh(capsuleGeoCache.footAuraBall, footAuraMat);
          rightFootAura.position.set(0, -0.26, 0.05);
          kneePivot.add(rightFootAura);
        }

        hipPivot.add(kneePivot);
        return { hipPivot, kneePivot };
      }

      const leftLeg = createCapsuleLeg(true);
      const rightLeg = createCapsuleLeg(false);
      bodyRoot.add(leftLeg.hipPivot, rightLeg.hipPivot);

      root.scale.setScalar(scale);
      scene.add(root);

      return {
        root,
        bodyRoot,
        headPivot,
        leftShoulder: leftArm.shoulderPivot,
        rightShoulder: rightArm.shoulderPivot,
        leftElbow: leftArm.elbowPivot,
        rightElbow: rightArm.elbowPivot,
        leftHip: leftLeg.hipPivot,
        rightHip: rightLeg.hipPivot,
        leftKnee: leftLeg.kneePivot,
        rightKnee: rightLeg.kneePivot,
        rightFistAura,
        leftFistAura,
        rightFootAura
      };
    }

    function buildWheelchairRig(options) {
      const rig = buildHumanRig(options);
      const frameMat = getCachedStandardMat(0x1e293b, 0.35, 0.65);
      const tireMat = getCachedStandardMat(0x090d16, 0.75, 0.05);
      const rimMat = getCachedStandardMat(0xe2e8f0, 0.25, 0.85);
      const seatMat = getCachedStandardMat(0x1e3a8a, 0.6, 0.05);

      const wcGroup = new THREE.Group();
      const seat = new THREE.Mesh(getCachedBoxGeom(0.56, 0.08, 0.52), seatMat);
      seat.position.set(0, 0.50, 0.02);
      const backrest = new THREE.Mesh(getCachedBoxGeom(0.54, 0.52, 0.07), seatMat);
      backrest.position.set(0, 0.78, -0.22);

      [-0.30, 0.30].forEach((ax) => {
        const arm = new THREE.Mesh(getCachedBoxGeom(0.05, 0.05, 0.48), frameMat);
        arm.position.set(ax, 0.68, 0.04);
        const armPost = new THREE.Mesh(getCachedBoxGeom(0.05, 0.22, 0.05), frameMat);
        armPost.position.set(ax, 0.58, 0.22);
        wcGroup.add(arm, armPost);
      });

      const bigWheelGeom = new THREE.TorusGeometry(0.32, 0.032, 8, 20);
      const handRimGeom = new THREE.TorusGeometry(0.25, 0.015, 6, 16);
      const smallCasterGeom = new THREE.TorusGeometry(0.10, 0.022, 6, 12);

      [-0.33, 0.33].forEach((wx) => {
        const bigWheel = new THREE.Mesh(bigWheelGeom, tireMat);
        bigWheel.rotation.y = Math.PI / 2;
        bigWheel.position.set(wx, 0.34, -0.08);

        const handRim = new THREE.Mesh(handRimGeom, rimMat);
        handRim.rotation.y = Math.PI / 2;
        handRim.position.set(wx + (wx > 0 ? 0.025 : -0.025), 0.34, -0.08);

        const smallCaster = new THREE.Mesh(smallCasterGeom, tireMat);
        smallCaster.rotation.y = Math.PI / 2;
        smallCaster.position.set(wx * 0.78, 0.12, 0.28);

        wcGroup.add(bigWheel, handRim, smallCaster);
      });

      rig.root.add(wcGroup);

      rig.bodyRoot.position.y = -0.02;
      rig.leftHip.rotation.x = -Math.PI / 2.05;
      rig.rightHip.rotation.x = -Math.PI / 2.05;
      rig.leftKnee.rotation.x = Math.PI / 2.05;
      rig.rightKnee.rotation.x = Math.PI / 2.05;
      rig.leftShoulder.rotation.x = -0.35;
      rig.rightShoulder.rotation.x = -0.35;
      rig.leftElbow.rotation.x = -0.55;
      rig.rightElbow.rotation.x = -0.55;

      return rig;
    }

    // 2. 自動取得從 1index.html 帶入的角色設定（同時存入 localStorage 供跨頁保留）
    function getInheritedRole() {
      const params = new URLSearchParams(window.location.search);
      const roleId = params.get('role') || localStorage.getItem('clover_hospital_role') || 'it_engineer';
      const found = CHARACTER_ROLES.find((r) => r.id === roleId) || CHARACTER_ROLES[0];
      try {
        localStorage.setItem('clover_hospital_role', found.id);
      } catch (e) {}
      return found;
    }

    function spawnFloatingText(worldPos, text, colorClass = 'text-amber-300') {
      const layer = document.getElementById('floating-fx-layer');
      const div = document.createElement('div');
      div.className = `fixed gta-font gta-shadow font-black text-base sm:text-xl pointer-events-none transition-all duration-700 ${colorClass}`;
      div.textContent = text;
      layer.appendChild(div);

      const proj = worldPos.clone().add(new THREE.Vector3(0, 1.95, 0)).project(camera);
      const sx = (proj.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-proj.y * 0.5 + 0.5) * window.innerHeight;
      div.style.left = `${sx}px`;
      div.style.top = `${sy}px`;
      div.style.transform = 'translate(-50%, 0px) scale(0.9)';

      requestAnimationFrame(() => {
        div.style.top = `${sy - 54}px`;
        div.style.opacity = '0';
        div.style.transform = 'translate(-50%, -12px) scale(1.18)';
      });

      setTimeout(() => div.remove(), 750);
    }

    function spawnSlashArc(origin, yaw, colorHex = 0x38bdf8, radius = 1.45, tiltZ = 0.25) {
      const geom = new THREE.RingGeometry(radius * 0.55, radius, 14, 1, -Math.PI * 0.42, Math.PI * 0.84);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.copy(origin).add(new THREE.Vector3(0, 1.05, 0));
      mesh.rotation.x = Math.PI / 2 + tiltZ;
      mesh.rotation.z = -yaw + Math.PI / 2;
      scene.add(mesh);
      slashEffects.push({ mesh, life: 0.22, maxLife: 0.22 });
    }

    function spawnImpactSparks(pos, colorHex = 0xfbbf24, count = 8) {
      for (let i = 0; i < count; i++) {
        let mesh = particlePool.pop();
        if (!mesh) {
          mesh = new THREE.Mesh(
            getCachedSphereGeom(0.065, 6, 6),
            new THREE.MeshBasicMaterial({ color: colorHex })
          );
        } else {
          mesh.material.color.setHex(colorHex);
          mesh.visible = true;
        }
        mesh.position.copy(pos).add(new THREE.Vector3(0, 1.05, 0));
        scene.add(mesh);
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.5;
        impactParticles.push({
          mesh,
          vel: new THREE.Vector3(Math.cos(angle) * speed, 2.2 + Math.random() * 3.5, Math.sin(angle) * speed),
          life: 0.36
        });
      }
    }

    function triggerMeleeCombo(forceHeavy = false) {
      if (activeTalkNpc || activeFloorModal || isRedirecting) return;

      SoundFX.ensureContext();
      if (player.attackTimer > 0.08) return;

      if (forceHeavy) {
        player.attackType = 4;
        player.comboStep = 0;
        player.attackDuration = 0.42;
      } else {
        player.comboStep = (player.comboStep % 4) + 1;
        player.attackType = player.comboStep;
        player.attackDuration = player.attackType === 4 ? 0.38 : 0.26;
      }

      player.attackTimer = player.attackDuration;
      player.comboResetTimer = 1.25;
      player.hitAppliedThisSwing = false;

      const isHeavy = player.attackType === 4;
      SoundFX.playWhoosh(isHeavy);

      const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
      const lungeDist = isHeavy ? 0.42 : 0.24;
      moveEntityWithCollision(player.pos, forward.x * lungeDist, forward.z * lungeDist, player.radius, null);

      const arcColors = [0x38bdf8, 0xfbbf24, 0x34d399, 0xf43f5e];
      const tilts = [0.22, -0.25, 0.45, 0.05];
      spawnSlashArc(
        player.pos,
        player.yaw,
        arcColors[(player.attackType - 1) % 4],
        isHeavy ? 1.85 : 1.38,
        tilts[(player.attackType - 1) % 4]
      );
    }

    function applyMeleeHitCheck() {
      if (player.hitAppliedThisSwing) return;
      const progress = 1 - player.attackTimer / player.attackDuration;
      if (progress < 0.35 || progress > 0.72) return;

      player.hitAppliedThisSwing = true;
      const isHeavy = player.attackType === 4;
      const reach = isHeavy ? 2.25 : 1.78;
      const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));

      let hitCount = 0;

      npcs.forEach((npc) => {
        if (npc.state === 'ko' || npc.isSupinePatient) return;

        const toNpc = new THREE.Vector3().subVectors(npc.pos, player.pos);
        toNpc.y = 0;
        const dist = toNpc.length();
        if (dist > reach) return;

        toNpc.normalize();
        const dot = forward.dot(toNpc);
        if (!isHeavy && dot < 0.32) return;

        hitCount++;
        player.totalHitsLanded++;

        const dmg = isHeavy ? 42 : 16 + player.attackType * 4;
        npc.hp = Math.max(0, npc.hp - dmg);

        const knockForce = isHeavy ? 9.5 : 4.2;

    function resolveCircleAABB(pos, radius) {
      pos.x = Math.max(-52.4, Math.min(52.4, pos.x));
      pos.z = Math.max(-46.4, Math.min(44.2, pos.z));

      for (let i = 0; i < colliders.length; i++) {
        const box = colliders[i];
        const closestX = Math.max(box.minX, Math.min(pos.x, box.maxX));
        const closestZ = Math.max(box.minZ, Math.min(pos.z, box.maxZ));

        const dx = pos.x - closestX;
        const dz = pos.z - closestZ;
        const distSq = dx * dx + dz * dz;

        if (distSq < radius * radius) {
          const dist = Math.sqrt(distSq);
          if (dist > 0.0001) {
            const overlap = radius - dist;
            pos.x += (dx / dist) * overlap;
            pos.z += (dz / dist) * overlap;
          } else {
            const leftPen = Math.abs(pos.x - box.minX);
            const rightPen = Math.abs(box.maxX - pos.x);
            const topPen = Math.abs(pos.z - box.minZ);
            const botPen = Math.abs(box.maxZ - pos.z);
            const minPen = Math.min(leftPen, rightPen, topPen, botPen);
            if (minPen === leftPen) pos.x = box.minX - radius;
            else if (minPen === rightPen) pos.x = box.maxX + radius;
            else if (minPen === topPen) pos.z = box.minZ - radius;
            else pos.z = box.maxZ + radius;
          }
        }
      }
    }
function checkTransportAndExitTriggers() {

    function updatePlayer(dt) {
      if (hitStopTimer > 0) {
        hitStopTimer -= dt;
        return;
      }

      if (player.comboResetTimer > 0) {
        player.comboResetTimer -= dt;
        if (player.comboResetTimer <= 0) {
          player.comboStep = 0;
          player.totalHitsLanded = 0;
          updateComboBadgeUI();
        }
      }

      if (player.attackTimer > 0) {
        player.attackTimer = Math.max(0, player.attackTimer - dt);
        applyMeleeHitCheck();
      }

      const canMove = !activeTalkNpc && !activeFloorModal && !isRedirecting;
      let moveForward = 0;
      let moveRight = 0;
      if (canMove) {
        if (keys['KeyW'] || keys['ArrowUp']) moveForward += 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveForward -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveRight += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveRight -= 1;
      }

      player.isSprinting = Boolean(keys['ShiftLeft'] || keys['ShiftRight'] || touchSprintActive);
      const moveSpeed = player.isSprinting ? 8.8 : 4.9;

      const camForward = new THREE.Vector3(-Math.sin(camState.yaw), 0, -Math.cos(camState.yaw));
      const camRight = new THREE.Vector3(Math.cos(camState.yaw), 0, -Math.sin(camState.yaw));

      const moveDir = new THREE.Vector3()
        .addScaledVector(camForward, moveForward)
        .addScaledVector(camRight, moveRight);

      const isMoving = moveDir.lengthSq() > 0.001;
      if (isMoving) {
        moveDir.normalize();
        const targetYaw = Math.atan2(moveDir.x, moveDir.z);
        let diff = targetYaw - player.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.yaw += diff * Math.min(1, 16 * dt);

        moveEntityWithCollision(player.pos, moveDir.x * moveSpeed * dt, moveDir.z * moveSpeed * dt, player.radius, null);
      } else {
        resolveCircleAABB(player.pos, player.radius);
        resolveCharacterCollisions(player.pos, player.radius, null);
      }

      if (canMove && keys['Space'] && player.onGround) {
        player.vel.y = 6.6;
        player.onGround = false;
      }
      player.vel.y -= 18.5 * dt;
      player.pos.y += player.vel.y * dt;
      if (player.pos.y <= 0) {
        player.pos.y = 0;
        player.vel.y = 0;
        player.onGround = true;
      }

      checkTransportAndExitTriggers();

      player.mesh.position.copy(player.pos);
      player.mesh.rotation.y = player.yaw;

      animatePlayerRig(dt, isMoving);

      if (frameCounter % 6 === 0) {
        updateCurrentZoneHUD();
      }
    }

    function animatePlayerRig(dt, isMoving) {
      player.breathCycle += dt * 3.0;

      if (player.rightFistAura) player.rightFistAura.material.opacity = 0;
      if (player.leftFistAura) player.leftFistAura.material.opacity = 0;
      if (player.rightFootAura) player.rightFootAura.material.opacity = 0;

      if (player.attackTimer > 0) {
        const p = 1 - player.attackTimer / player.attackDuration;
        const swing = Math.sin(p * Math.PI);

        if (player.attackType === 1) {
          player.leftShoulder.rotation.x = -1.65 * swing;
          player.leftElbow.rotation.x = -0.35 * (1 - swing);
          player.bodyRoot.rotation.y = -0.38 * swing;
          if (player.leftFistAura) player.leftFistAura.material.opacity = 0.78 * swing;
        } else if (player.attackType === 2) {
          player.rightShoulder.rotation.x = -1.75 * swing;
          player.rightShoulder.rotation.z = -0.45 * swing;
          player.rightElbow.rotation.x = -0.55 * swing;
          player.bodyRoot.rotation.y = 0.45 * swing;
          if (player.rightFistAura) player.rightFistAura.material.opacity = 0.85 * swing;
        } else if (player.attackType === 3) {
          player.rightShoulder.rotation.x = -2.25 * swing;
          player.rightElbow.rotation.x = -0.65 * swing;
          player.bodyRoot.position.y = 0.14 * swing;
          player.bodyRoot.rotation.y = 0.35 * swing;
          if (player.rightFistAura) player.rightFistAura.material.opacity = 0.9 * swing;
        } else if (player.attackType === 4) {
          player.bodyRoot.rotation.y = p * Math.PI * 2;
          player.rightHip.rotation.x = -1.65 * swing;
          player.rightKnee.rotation.x = 0.25 * swing;
          player.leftShoulder.rotation.z = 0.7 * swing;
          player.rightShoulder.rotation.z = -0.7 * swing;
          if (player.rightFootAura) player.rightFootAura.material.opacity = 0.92 * swing;
        }
        return;
      }

      player.bodyRoot.rotation.y = THREE.MathUtils.lerp(player.bodyRoot.rotation.y, 0, 14 * dt);
      player.bodyRoot.rotation.x = THREE.MathUtils.lerp(player.bodyRoot.rotation.x, isMoving && player.isSprinting ? 0.12 : 0, 10 * dt);

      if (isMoving) {
        const freq = player.isSprinting ? 14.5 : 9.5;
        const amp = player.isSprinting ? 0.88 : 0.56;
        player.walkCycle += dt * freq;
        const s = Math.sin(player.walkCycle);
        const c = Math.cos(player.walkCycle);

        player.leftHip.rotation.x = s * amp;
        player.rightHip.rotation.x = -s * amp;
        player.leftKnee.rotation.x = Math.max(0, -c) * (amp * 0.95);
        player.rightKnee.rotation.x = Math.max(0, c) * (amp * 0.95);

        player.leftShoulder.rotation.x = -s * (amp * 0.85);
        player.rightShoulder.rotation.x = s * (amp * 0.85);
        player.leftShoulder.rotation.z = 0.08;
        player.rightShoulder.rotation.z = -0.08;
        player.leftElbow.rotation.x = -0.35 - Math.max(0, s) * 0.45;
        player.rightElbow.rotation.x = -0.35 - Math.max(0, -s) * 0.45;

        player.bodyRoot.position.y = Math.abs(c) * 0.055;
      } else {
        const b = Math.sin(player.breathCycle);
        player.bodyRoot.position.y = b * 0.014;
        player.leftHip.rotation.x = THREE.MathUtils.lerp(player.leftHip.rotation.x, 0, 10 * dt);
        player.rightHip.rotation.x = THREE.MathUtils.lerp(player.rightHip.rotation.x, 0, 10 * dt);
        player.leftKnee.rotation.x = THREE.MathUtils.lerp(player.leftKnee.rotation.x, 0, 10 * dt);
        player.rightKnee.rotation.x = THREE.MathUtils.lerp(player.rightKnee.rotation.x, 0, 10 * dt);

        player.leftShoulder.rotation.x = THREE.MathUtils.lerp(player.leftShoulder.rotation.x, 0, 10 * dt);
        player.rightShoulder.rotation.x = THREE.MathUtils.lerp(player.rightShoulder.rotation.x, 0, 10 * dt);
        player.leftShoulder.rotation.z = 0.06 + b * 0.02;
        player.rightShoulder.rotation.z = -0.06 - b * 0.02;
        player.leftElbow.rotation.x = -0.14;
        player.rightElbow.rotation.x = -0.14;
      }
    }
