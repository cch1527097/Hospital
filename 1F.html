          }

          if (isLeftPunch) {
            npc.leftShoulder.rotation.x = -1.75 * swing;
            npc.leftElbow.rotation.x = -0.3 * (1 - swing);
            npc.rightShoulder.rotation.x = -0.5;
            npc.bodyRoot.rotation.y = -0.35 * swing;
          } else {
            npc.rightShoulder.rotation.x = -1.85 * swing;
            npc.rightElbow.rotation.x = -0.4 * (1 - swing);
            npc.leftShoulder.rotation.x = -0.5;
            npc.bodyRoot.rotation.y = 0.35 * swing;
          }
          npc.bodyRoot.position.y = Math.abs(Math.sin(nowTime * 5.2)) * 0.03;

          // 揮拳命中瞬間觸發火花與漂浮字（冷卻 0.38 秒避免重複觸發）
          if (punchCycle > 0.45 && punchCycle < 0.55 && (!npc.lastBrawlFx || nowTime - npc.lastBrawlFx > 0.38)) {
            npc.lastBrawlFx = nowTime;
            if (targetNurse && targetNurse.state !== 'ko') {
              spawnImpactSparks(targetNurse.pos, 0xf43f5e, 5);
              if (Math.hypot(player.pos.x - npc.pos.x, player.pos.z - npc.pos.z) < 16) {
                spawnFloatingText(targetNurse.pos, '💢 醫療暴力！快制止他！', 'text-rose-400');
              }
            }
          }

          npc.mesh.position.copy(npc.pos);
          npc.mesh.rotation.y = npc.yaw;
          continue;
        }

        // 受攻擊的急診護理師：雙手護頭防禦與受擊後仰
        if (npc.isErVictim) {
          const flinch = Math.max(0, Math.sin((nowTime * 2.6) * Math.PI));
          npc.leftShoulder.rotation.x = -1.45;
          npc.rightShoulder.rotation.x = -1.45;
          npc.leftElbow.rotation.x = -1.35;
          npc.rightElbow.rotation.x = -1.35;
          npc.bodyRoot.rotation.x = -0.22 * flinch;
          npc.headPivot.rotation.z = Math.sin(nowTime * 12) * 0.08 * flinch;
          npc.mesh.position.copy(npc.pos);
          npc.mesh.rotation.y = npc.yaw;
          continue;
        }

        if (npc.isErBrawler) {
          // 制止急診暴力屬於見義勇為，不增加通緝星數並獎勵護甲
          player.armor = Math.min(100, player.armor + 5);
          updateHealthArmorBarsUI();
          if (npc.hp <= 0) {
            spawnFloatingText(player.pos, '🛡️ 見義勇為！成功保護醫護人員！', 'text-emerald-300');
          }
        } else {
          const prevStars = player.wantedStars;
          player.wantedStars = Math.min(5, Math.max(player.wantedStars, npc.isGuard ? 3 : 1 + Math.floor(player.totalHitsLanded / 4)));
          if (player.wantedStars > prevStars) {
            SoundFX.playSirenChirp();
            updateWantedStarsUI();
          }
        }

        if (npc.isSeated || npc.isWheelchair || npc.patrolRadius === 0) {
          npc.walkPhase += dt * 2.2;
          if (!npc.isSeated && !npc.isWheelchair) {
            npc.bodyRoot.position.y = Math.sin(npc.walkPhase) * 0.015;
          }
          if (distToPlayer < 4.0) {
            const lookYaw = Math.atan2(player.pos.x - npc.pos.x, player.pos.z - npc.pos.z);
            let diff = lookYaw - npc.yaw;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            npc.headPivot.rotation.y = THREE.MathUtils.clamp(diff, -0.75, 0.75);
          } else {
            npc.headPivot.rotation.y = Math.sin(nowTime * 1.2 + i) * 0.15;
          }
          npc.mesh.position.copy(npc.pos);
          npc.mesh.rotation.y = npc.yaw;
          continue;
        }

        let speed = 1.45;
        let isMoving = false;

        if (npc.state === 'flee') {
          npc.stateTimer -= dt;
          speed = 4.6;
          const away = new THREE.Vector3().subVectors(npc.pos, player.pos);
          away.y = 0;
          if (away.lengthSq() > 0.01) {
            away.normalize();
            npc.yaw = Math.atan2(away.x, away.z);
            moveEntityWithCollision(npc.pos, away.x * speed * dt, away.z * speed * dt, 0.42, npc);
            isMoving = true;
          }
          if (npc.stateTimer <= 0) npc.state = 'patrol';
        } else if (npc.state === 'chase') {
          npc.stateTimer -= dt;
          speed = 4.0;
          const toP = new THREE.Vector3().subVectors(player.pos, npc.pos);
          toP.y = 0;
          const d = toP.length();
          if (d > 1.35) {
            toP.normalize();
            npc.yaw = Math.atan2(toP.x, toP.z);
            moveEntityWithCollision(npc.pos, toP.x * speed * dt, toP.z * speed * dt, 0.42, npc);
            isMoving = true;
          } else if (Math.random() < 1.8 * dt) {
            if (player.armor > 0) player.armor = Math.max(0, player.armor - 4);
            else player.hp = Math.max(10, player.hp - 5);
            updateHealthArmorBarsUI();
            spawnFloatingText(player.pos, '警衛電擊警告!', 'text-amber-300');
          }
          if (npc.stateTimer <= 0 || player.wantedStars === 0) npc.state = 'patrol';
        } else {
          const toTarget = new THREE.Vector3().subVectors(npc.targetPos, npc.pos);
          toTarget.y = 0;
          if (toTarget.length() > 0.35) {
            toTarget.normalize();
            npc.yaw = Math.atan2(toTarget.x, toTarget.z);
            moveEntityWithCollision(npc.pos, toTarget.x * speed * dt, toTarget.z * speed * dt, 0.42, npc);
            isMoving = true;
          } else {
            npc.waitTimer -= dt;
            if (npc.waitTimer <= 0) {
              const ang = Math.random() * Math.PI * 2;
              const r = Math.random() * npc.patrolRadius;
              npc.targetPos.set(npc.homePos.x + Math.cos(ang) * r, 0, npc.homePos.z + Math.sin(ang) * r);
              npc.waitTimer = 1.8 + Math.random() * 2.5;
            }
          }
        }

        npc.mesh.position.copy(npc.pos);
        npc.mesh.rotation.y = npc.yaw;

        if (isMoving) {
          npc.walkPhase += dt * (speed * 4.4);
          const s = Math.sin(npc.walkPhase);
          npc.leftHip.rotation.x = s * 0.55;
          npc.rightHip.rotation.x = -s * 0.55;
          npc.leftShoulder.rotation.x = -s * 0.45;
          npc.rightShoulder.rotation.x = s * 0.45;
          npc.bodyRoot.position.y = Math.abs(Math.cos(npc.walkPhase)) * 0.04;
        } else {
          npc.leftHip.rotation.x = THREE.MathUtils.lerp(npc.leftHip.rotation.x, 0, 8 * dt);
          npc.rightHip.rotation.x = THREE.MathUtils.lerp(npc.rightHip.rotation.x, 0, 8 * dt);
          npc.leftShoulder.rotation.x = THREE.MathUtils.lerp(npc.leftShoulder.rotation.x, 0, 8 * dt);
          npc.rightShoulder.rotation.x = THREE.MathUtils.lerp(npc.rightShoulder.rotation.x, 0, 8 * dt);
          npc.bodyRoot.position.y = 0;
        }
      }

      nearestNpc = closest;
      const promptEl = document.getElementById('npc-talk-prompt');
      if (nearestNpc && !activeTalkNpc && !activeFloorModal) {
        promptEl.innerHTML = `按 <span class="px-2 py-0.5 mx-1 rounded-md bg-emerald-400 text-slate-950 font-black">E</span> 與 <span id="prompt-npc-name" class="text-amber-300">${nearestNpc.name} (${nearestNpc.role})</span> 交談`;
        promptEl.classList.remove('hidden');
      } else if (nearGrandPiano && !activeTalkNpc && !activeFloorModal) {
        promptEl.innerHTML = `按 <span class="px-2 py-0.5 mx-1 rounded-md bg-emerald-400 text-slate-950 font-black">E</span> 彈奏大廳三角演奏鋼琴`;
        promptEl.classList.remove('hidden');
      } else {
        promptEl.classList.add('hidden');
      }
    }

    const _projVec = new THREE.Vector3();
    function updateNpcLabelsProjection() {
      const camPos = camera.position;
      for (let i = 0; i < npcs.length; i++) {
        const npc = npcs[i];
        const el = npc.labelEl;
        if (!showNpcLabels || npc.state === 'ko') {
          if (npc.lastLabelVisible) {
            el.style.display = 'none';
            npc.lastLabelVisible = false;
          }
          continue;
        }

        const dx = npc.pos.x - camPos.x;
        const dy = npc.pos.y - camPos.y;
        const dz = npc.pos.z - camPos.z;
        const distSq = dx * dx + dy * dy + dz * dz;

        if (distSq > 484) {
          if (npc.lastLabelVisible) {
            el.style.display = 'none';
            npc.lastLabelVisible = false;
          }
          continue;
        }

        _projVec.set(npc.pos.x, npc.pos.y + (npc.isSupinePatient ? 0.92 : 1.92), npc.pos.z);
        _projVec.project(camera);

        if (_projVec.z > 1) {
          if (npc.lastLabelVisible) {
            el.style.display = 'none';
            npc.lastLabelVisible = false;
          }
          continue;
        }

        if (!npc.lastLabelVisible) {
          el.style.display = 'block';
          npc.lastLabelVisible = true;
        }

        const sx = Math.round((_projVec.x + 1) * cachedHalfW);
        const sy = Math.round((-_projVec.y + 1) * cachedHalfH);
        if (sx !== npc.lastLabelX || sy !== npc.lastLabelY) {
          el.style.transform = `translate3d(${sx}px, ${sy}px, 0) translate(-50%, -100%)`;
          npc.lastLabelX = sx;
          npc.lastLabelY = sy;
        }
      }
    }

    function updateVisualEffects(dt) {
      for (let i = slashEffects.length - 1; i >= 0; i--) {
        const fx = slashEffects[i];
        fx.life -= dt;
        const ratio = Math.max(0, fx.life / fx.maxLife);
        fx.mesh.material.opacity = ratio;
        fx.mesh.scale.setScalar(1 + (1 - ratio) * 0.45);
        if (fx.life <= 0) {
          scene.remove(fx.mesh);
          fx.mesh.geometry.dispose();
          fx.mesh.material.dispose();
          slashEffects.splice(i, 1);
        }
      }

      for (let i = impactParticles.length - 1; i >= 0; i--) {
        const pt = impactParticles[i];
        pt.life -= dt;
        pt.vel.y -= 15 * dt;
        pt.mesh.position.addScaledVector(pt.vel, dt);
        pt.mesh.scale.setScalar(Math.max(0.01, pt.life / 0.36));
        if (pt.life <= 0) {
          scene.remove(pt.mesh);
          pt.mesh.visible = false;
          particlePool.push(pt.mesh);
          impactParticles.splice(i, 1);
        }
      }

      if (lotusChandelierGroup) {
        lotusChandelierGroup.rotation.y += dt * 0.14;
      }

      // MRI 檢查床與患者同步前後掃描移動
      if (mriSlidingTableMesh) {
        const mriOffset = Math.sin(clock.elapsedTime * 0.7) * 0.75;
        mriSlidingTableMesh.position.z = -23.8 + mriOffset;
        if (mriPatientNpcRef) {
          mriPatientNpcRef.pos.z = -23.0 + mriOffset;
        }
      }

      if (ctSlidingTableMesh) {
        ctSlidingTableMesh.position.z = -23.7 + Math.cos(clock.elapsedTime * 0.9) * 0.65;
      }
      if (erMonitorScreenMat) {
        erMonitorScreenMat.emissiveIntensity = 0.48 + Math.sin(clock.elapsedTime * 9.5) * 0.18;
      }

      updateAutoSlidingDoors(dt);
      updateEscalator(dt);
    }

    function updateCamera(dt) {
      camState.yaw = THREE.MathUtils.lerp(camState.yaw, camState.targetYaw, 18 * dt);
      camState.pitch = THREE.MathUtils.lerp(camState.pitch, camState.targetPitch, 18 * dt);
      camState.distance = THREE.MathUtils.lerp(camState.distance, camState.targetDistance, 14 * dt);

      const shakeOffset = new THREE.Vector3();
      if (camShake > 0.001) {
        shakeOffset.set(
          (Math.random() - 0.5) * camShake,
          (Math.random() - 0.5) * camShake,
          (Math.random() - 0.5) * camShake
        );
        camShake *= Math.pow(0.03, dt);
      }

      const headTarget = new THREE.Vector3(player.pos.x, player.pos.y + 1.56, player.pos.z);
      camState.targetPos.lerp(headTarget, 22 * dt);

      if (camState.firstPerson) {
        player.mesh.visible = false;
        const eyePos = new THREE.Vector3(player.pos.x, player.pos.y + 1.62, player.pos.z).add(shakeOffset);
        camera.position.copy(eyePos);
        const lookDir = new THREE.Vector3(
          -Math.sin(camState.yaw) * Math.cos(camState.pitch),
          -Math.sin(camState.pitch),
          -Math.cos(camState.yaw) * Math.cos(camState.pitch)
        );
        camera.lookAt(eyePos.clone().add(lookDir));
      } else {
        player.mesh.visible = true;
        const offsetX = Math.sin(camState.yaw) * Math.cos(camState.pitch) * camState.distance;
        const offsetY = Math.sin(camState.pitch) * camState.distance + 0.52;
        const offsetZ = Math.cos(camState.yaw) * Math.cos(camState.pitch) * camState.distance;

        const desiredCamPos = new THREE.Vector3(
          camState.targetPos.x + offsetX,
          Math.max(0.65, camState.targetPos.y + offsetY),
          camState.targetPos.z + offsetZ
        );

        desiredCamPos.x = Math.max(-52.2, Math.min(52.2, desiredCamPos.x));
        desiredCamPos.z = Math.max(-46.2, Math.min(43.8, desiredCamPos.z));

        camera.position.copy(desiredCamPos).add(shakeOffset);
        camera.lookAt(camState.targetPos);
      }
    }

    const minimapCanvas = document.getElementById('minimap-canvas');
    const mctx = minimapCanvas.getContext('2d');

    function drawMinimap() {
      const w = minimapCanvas.width;
      const h = minimapCanvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const scale = 1.92;

      mctx.clearRect(0, 0, w, h);

      mctx.save();
      mctx.beginPath();
      mctx.arc(cx, cy, cx - 2, 0, Math.PI * 2);
      mctx.clip();

      mctx.fillStyle = '#fefce8';
      mctx.fillRect(0, 0, w, h);

      const toMap = (wx, wz) => ({
        x: cx + (wx - player.pos.x) * scale,
        y: cy + (wz - player.pos.z) * scale
      });

      const drawRoom = (x1, z1, x2, z2, fill) => {
        const p1 = toMap(x1, z1);
        const p2 = toMap(x2, z2);
        mctx.fillStyle = fill;
        mctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
        mctx.strokeStyle = '#15803d';
        mctx.lineWidth = 1.1;
        mctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
      };

      drawRoom(-53.5, -47.5, -18, -36.5, '#fde68a');
      drawRoom(18, -47.5, 53.5, -36.5, '#fbcfe8');
      drawRoom(-34.5, -32.8, -12.5, -13.5, '#bae6fd');
      drawRoom(7.2, -32.8, 37.2, -13.5, '#fda4af');
      drawRoom(37.2, -32.8, 53.5, 2.2, '#fecdd3');
      drawRoom(-34, -10.8, -15, -6.5, '#bae6fd');
      drawRoom(12, -10.8, 29, -6.5, '#bae6fd');
      drawRoom(-11.2, 0.8, 11.2, 4.0, '#f9a8d4');
      drawRoom(-12.2, 6.6, 9.2, 8.0, '#fbcfe8');
      drawRoom(-29, 11.3, -16, 18.7, '#e2e8f0');
      drawRoom(16, 11.3, 29, 18.7, '#e2e8f0');
      drawRoom(-53.0, 20.2, -36.2, 34.8, '#c7d2fe');
      drawRoom(-53.0, 34.8, -36.2, 44.0, '#fdba74');
      drawRoom(-33.5, 21.8, -18.2, 37.2, '#fbcfe8');
      drawRoom(-18.0, 26.8, -14.2, 34.2, '#fed7aa');
      drawRoom(-6.0, 20.6, 6.0, 38.4, '#fef3c7');
      drawRoom(14.2, 26.8, 18.0, 34.2, '#bbf7d0');
      drawRoom(18.2, 21.8, 33.5, 37.2, '#fbcfe8');
      drawRoom(35.2, 20.0, 53.5, 43.0, '#bae6fd');

      for (let i = 0; i < npcs.length; i++) {
        const npc = npcs[i];
        if (npc.state === 'ko') continue;
        const p = toMap(npc.pos.x, npc.pos.z);
        mctx.fillStyle = npc.isGuard ? '#2563eb' : (npc.isDoingCPR || npc.isMedicalAttending) ? '#e11d48' : '#10b981';
        mctx.beginPath();
        mctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
        mctx.fill();
      }

      mctx.save();
      mctx.translate(cx, cy);
      mctx.rotate(-player.yaw + Math.PI);
      mctx.fillStyle = '#e11d48';
      mctx.beginPath();
      mctx.moveTo(0, -7);
      mctx.lineTo(5.2, 6);
      mctx.lineTo(0, 3);
      mctx.lineTo(-5.2, 6);
      mctx.closePath();
      mctx.fill();
      mctx.restore();

      mctx.restore();
    }

    function cycleLightingMode() {
      currentLightingIdx = (currentLightingIdx + 1) % LIGHTING_MODES.length;
      const mode = LIGHTING_MODES[currentLightingIdx];

      renderer.toneMappingExposure = mode.exposure;
      scene.background.setHex(mode.bg);
      scene.fog.color.setHex(mode.fogColor);
      scene.fog.density = mode.fogDensity;

      if (hemiLightRef) {
        hemiLightRef.color.setHex(mode.hemiSky);
        hemiLightRef.groundColor.setHex(mode.hemiGround);
        hemiLightRef.intensity = mode.hemiInt;
      }
      if (dirLightRef) {
        dirLightRef.color.setHex(mode.dirColor);
        dirLightRef.intensity = mode.dirInt;
      }
      if (lotusPointLight) {
        lotusPointLight.intensity = mode.lotusInt;
      }
      lotusPetalMats.forEach((m) => {
        m.emissiveIntensity = mode.lotusEmissive;
      });
      louverSconceMats.forEach((m) => {
        m.emissiveIntensity = mode.sconceEmissive;
      });

      document.getElementById('lighting-mode-text').textContent = mode.label;
      spawnFloatingText(player.pos, mode.label, 'text-amber-300');
    }

    // 16. 事件綁定與靈活滑鼠控制

    function setupInputsAndUI() {
      const canvas = document.getElementById('game-canvas');

      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;

        if (e.code === 'Escape') {
          if (activeTalkNpc) closeDialogue();
          else if (activeFloorModal) closeFloorModal(true);
          return;
        }

        if (e.code === 'KeyE') {
          if (activeTalkNpc) {
            closeDialogue();
          } else if (activeFloorModal) {
            closeFloorModal(true);
          } else if (nearestNpc) {
            openDialogue(nearestNpc);
          } else if (nearGrandPiano) {
            SoundFX.playPianoNote(pianoNoteIndex);
            const notes = ['♪ Do', '♫ Re', '♩ Mi', '♬ Sol', '♪ La', '♫ Do↑', '♩ Re↑', '♬ Mi↑'];
            spawnFloatingText(new THREE.Vector3(0, 0.2, 31.8), notes[pianoNoteIndex % notes.length], 'text-amber-300');
            pianoNoteIndex++;
          }
        }
        if (e.code === 'KeyJ') triggerMeleeCombo(false);
        if (e.code === 'KeyK') triggerMeleeCombo(true);
        if (e.code === 'KeyV') toggleFirstPerson();
        if (e.code === 'KeyM') togglePointerLockMode();
        if (e.code === 'KeyL') cycleLightingMode();
        if (e.code === 'KeyC') clearWantedAndHeal();
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      function togglePointerLockMode() {
        if (document.pointerLockElement === canvas) {
          document.exitPointerLock();
        } else {
          canvas.requestPointerLock?.();
        }
      }

      document.addEventListener('pointerlockchange', () => {
        const locked = document.pointerLockElement === canvas;
        camState.pointerLocked = locked;
        const btn = document.getElementById('btn-toggle-mouselock');
        const reticle = document.getElementById('pointer-lock-reticle');
        if (locked) {
          btn.textContent = '🔓 退出自由視角 (ESC)';
          btn.classList.add('ring-2', 'ring-teal-300');
          reticle.classList.remove('hidden');
        } else {
          btn.textContent = '🖱️ 自由視角 (M)';
          btn.classList.remove('ring-2', 'ring-teal-300');
          reticle.classList.add('hidden');
        }
      });

      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      canvas.addEventListener('mousedown', (e) => {
        if (activeTalkNpc || activeFloorModal || isRedirecting) return;

        if (camState.pointerLocked) {
          if (e.button === 0) triggerMeleeCombo(false);
          else if (e.button === 2) triggerMeleeCombo(true);
          return;
        }

        if (e.button === 0 || e.button === 2) {
          camState.isDragging = true;
          camState.dragButton = e.button;
          camState.lastX = e.clientX;
          camState.lastY = e.clientY;
          camState.movedDuringDrag = false;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (activeTalkNpc || activeFloorModal || isRedirecting) return;

        if (camState.pointerLocked) {
          camState.targetYaw -= e.movementX * 0.0042;
          camState.targetPitch = Math.max(-0.42, Math.min(0.88, camState.targetPitch + e.movementY * 0.0036));
          return;
        }

        if (!camState.isDragging) return;
        const dx = e.clientX - camState.lastX;
        const dy = e.clientY - camState.lastY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          camState.movedDuringDrag = true;
        }
        camState.lastX = e.clientX;
        camState.lastY = e.clientY;

        camState.targetYaw -= dx * 0.0068;
        camState.targetPitch = Math.max(-0.42, Math.min(0.88, camState.targetPitch + dy * 0.0054));
      });

      window.addEventListener('mouseup', (e) => {
        if (!camState.isDragging) return;
        const wasClick = !camState.movedDuringDrag;
        const btn = camState.dragButton;
        camState.isDragging = false;
        camState.dragButton = -1;

        if (wasClick && !activeTalkNpc && !activeFloorModal) {
          if (btn === 0) triggerMeleeCombo(false);
          else if (btn === 2) triggerMeleeCombo(true);
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        camState.targetDistance = Math.max(2.2, Math.min(11.5, camState.targetDistance + e.deltaY * 0.004));
      }, { passive: false });

      let touchLastX = 0;
      let touchLastY = 0;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchLastX = e.touches[0].clientX;
          touchLastY = e.touches[0].clientY;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchLastX;
          const dy = e.touches[0].clientY - touchLastY;
          touchLastX = e.touches[0].clientX;
          touchLastY = e.touches[0].clientY;
          camState.targetYaw -= dx * 0.0078;
          camState.targetPitch = Math.max(-0.4, Math.min(0.85, camState.targetPitch + dy * 0.006));
        }
      }, { passive: true });

      document.getElementById('btn-sim-gate-entry')?.addEventListener('click', () => {
        applyEntrySpawnPoint({
          type: 'entrance',
          pos: new THREE.Vector3(0, 0, 41.2),
          yaw: Math.PI,
          camYaw: 0,
          camPitch: 0.14,
          notice: '🚪 已模擬從南側大門進入大廳'
        }, true);
      });

      document.getElementById('btn-sim-er-entry')?.addEventListener('click', () => {
        applyEntrySpawnPoint({
          type: 'er',
          pos: new THREE.Vector3(24.5, 0, -15.2),
          yaw: Math.PI,
          camYaw: 0,
          camPitch: 0.16,
          notice: '🚑 已模擬從急診門口進入急診室'
        }, true);
      });

      document.querySelectorAll('.tp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const zKey = btn.getAttribute('data-zone');
          const zInfo = ZONES[zKey];
          if (!zInfo) return;
          player.pos.copy(zInfo.pos);
          player.yaw = zInfo.yaw;
          camState.targetYaw = zInfo.yaw + Math.PI;
          camState.yaw = camState.targetYaw;
          camState.targetPos.set(zInfo.pos.x, zInfo.pos.y + 1.56, zInfo.pos.z);
          spawnFloatingText(player.pos, `傳送至：${zInfo.label}`, 'text-teal-300');
          updateCurrentZoneHUD();
        });
      });

      function toggleFirstPerson() {
        camState.firstPerson = !camState.firstPerson;
        document.getElementById('btn-toggle-pov').textContent = camState.firstPerson ? '👁️ 第一人稱 (V)' : '👁️ 第三人稱 (V)';
      }
      document.getElementById('btn-toggle-pov')?.addEventListener('click', toggleFirstPerson);
document.getElementById('btn-toggle-mouselock')?.addEventListener('click', togglePointerLockMode);
document.getElementById('btn-cycle-lighting')?.addEventListener('click', cycleLightingMode);

document.getElementById('btn-toggle-labels')?.addEventListener('click', () => {
  showNpcLabels = !showNpcLabels;
  const lblBtn = document.getElementById('btn-toggle-labels');
  if (lblBtn) lblBtn.textContent = showNpcLabels ? '🏷️ 標籤: 開' : '🏷️ 標籤: 關';
});

document.getElementById('btn-open-floors')?.addEventListener('click', () => {
  openFloorModal(null);
});

document.getElementById('btn-clear-wanted')?.addEventListener('click', clearWantedAndHeal);

document.getElementById('btn-toggle-help')?.addEventListener('click', () => {
  const body = document.getElementById('help-body');
  const btn = document.getElementById('btn-toggle-help');
  if (body && btn) {
    body.classList.toggle('hidden');
    btn.textContent = body.classList.contains('hidden') ? '展開' : '收合';
  }
});

      document.getElementById('btn-action-attack').addEventListener('click', () => triggerMeleeCombo(false));
      document.getElementById('btn-action-heavy').addEventListener('click', () => triggerMeleeCombo(true));

      document.getElementById('dlg-close-btn').addEventListener('click', closeDialogue);
      document.getElementById('npc-talk-prompt').addEventListener('click', () => {
        if (nearestNpc) openDialogue(nearestNpc);
        else if (nearGrandPiano) {
          SoundFX.playPianoNote(pianoNoteIndex);
          pianoNoteIndex++;
        }
      });

      document.querySelectorAll('.touch-pad').forEach((btn) => {
        const k = btn.getAttribute('data-key');
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
      });

      const sprintBtn = document.getElementById('btn-touch-sprint');
      if (sprintBtn) {
        sprintBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          touchSprintActive = !touchSprintActive;
          sprintBtn.classList.toggle('bg-sky-600/80', touchSprintActive);
          sprintBtn.textContent = touchSprintActive ? '⚡ 衝刺中' : '⚡ 衝刺';
        });
      }

      const jumpBtn = document.getElementById('btn-touch-jump');
      if (jumpBtn) {
        jumpBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (player.onGround) { player.vel.y = 6.6; player.onGround = false; }
        });
      }

      const talkBtn = document.getElementById('btn-touch-talk');
      if (talkBtn) {
        talkBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (nearestNpc) openDialogue(nearestNpc);
        });
      }
    }

    // --------------------------------------------------------------------------
    // 17. 主場景初始化與 60FPS 高流暢主動畫迴圈
    // --------------------------------------------------------------------------
    function initScene() {
      const canvas = document.getElementById('game-canvas');
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.BasicShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe6dfd3);
      scene.fog = new THREE.FogExp2(0xe6dfd3, 0.0034);

      camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.2, 140);

      hemiLightRef = new THREE.HemisphereLight(0xfff8eb, 0xd6c7b2, 0.92);
      scene.add(hemiLightRef);

      dirLightRef = new THREE.DirectionalLight(0xffe8c2, 0.72);
      dirLightRef.position.set(16, 36, 28);
      dirLightRef.castShadow = true;
      dirLightRef.shadow.mapSize.width = 1024;
      dirLightRef.shadow.mapSize.height = 1024;
      dirLightRef.shadow.camera.near = 2;
      dirLightRef.shadow.camera.far = 95;
      const d = 46;
      dirLightRef.shadow.camera.left = -d;
      dirLightRef.shadow.camera.right = d;
      dirLightRef.shadow.camera.top = d;
      dirLightRef.shadow.camera.bottom = -d;
      scene.add(dirLightRef);

      // 1. 建立 1F 醫院室內場景、玩家與 NPC
      buildHospital1FInterior();
      createPlayer();
      createHospitalStaffAndPatients();

      // 2. 套用入口來源定位（南側大門進入 vs 急診門口進入）
      const entryCfg = resolveInitialEntryPoint();
      applyEntrySpawnPoint(entryCfg, false);

      // 3. 綁定鍵盤、滑鼠、觸控與樓層選單 UI 事件
      setupInputsAndUI();

      document.querySelectorAll('.floor-choice-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const floorKey = btn.getAttribute('data-floor');
          selectFloorAndRedirect(floorKey);
        });
      });

      const floorCloseBtn = document.getElementById('floor-modal-close');
      if (floorCloseBtn) {
        floorCloseBtn.addEventListener('click', () => closeFloorModal(true));
      }

      // 4. 啟動 1F 室內多人連線同步頻道
      initMultiplayer1F();

      // 5. 視窗縮放自適應
      window.addEventListener('resize', () => {
        cachedHalfW = window.innerWidth * 0.5;
        cachedHalfH = window.innerHeight * 0.5;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 6. 隱藏載入遮罩並顯示歡迎提示
      const loadingEl = document.getElementById('loading-overlay');
      if (loadingEl) {
        loadingEl.style.opacity = '0';
        setTimeout(() => {
          loadingEl.classList.add('hidden');
          spawnFloatingText(
            player.pos,
            entryCfg.notice,
            entryCfg.type === 'er' ? 'text-rose-300 text-lg' : 'text-amber-300 text-lg'
          );
        }, 450);
      }

      // 7. 啟動 60FPS 主渲染迴圈
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      frameCounter++;

      // 更新遊戲內時鐘（每 2 秒推進 1 分鐘）
      gameClockMinutes += dt * 0.5;
      if (frameCounter % 15 === 0) {
        const totalMins = Math.floor(gameClockMinutes) % (24 * 60);
        const hh = String(Math.floor(totalMins / 60)).padStart(2, '0');
        const mm = String(totalMins % 60).padStart(2, '0');
        const clockEl = document.getElementById('hud-clock');
        if (clockEl) clockEl.textContent = `${hh}:${mm}`;
      }

      updatePlayer(dt);
      updateRemotePlayers1F(dt);
      updateNPCs(dt);
      updateVisualEffects(dt);
      updateCamera(dt);

      if (frameCounter % 2 === 0) {
        updateNpcLabelsProjection();
      }
      if (frameCounter % 4 === 0) {
        drawMinimap();
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', initScene);
  </script>
